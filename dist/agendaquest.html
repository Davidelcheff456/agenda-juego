    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    candado: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
    camara: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
    hoy: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
    examen: '<path d="M7 3h7l4 4v14H7z"/><path d="M10 12h5M10 16h5"/>',
    materias: '<path d="M4 5h6v15H4zM10 5h4v15h-4zM15 6l4-1 3 14-4 1z"/>',
    mascota: '<rect x="5" y="7" width="14" height="12" rx="3"/><path d="M12 7V4M9 4h6"/><circle cx="9.5" cy="12.5" r="1"/><circle cx="14.5" cy="12.5" r="1"/>',
    ajustes: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
    salir: '<path d="M10 5H5v14h5M14 8l4 4-4 4M18 12H9"/>',
    basura: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
    lapiz: '<path d="M4 20h4L19 9l-4-4L4 16z"/>',
    reloj: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6M12 2v3"/>',
    perfiles: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.3-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.8c1.6.9 2.6 2.7 3 5.2"/>'
  };

  function icono(nombre, tam, grosor) {
    return '<svg class="icono" width="' + (tam || 20) + '" height="' + (tam || 20) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (grosor || 2) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONOS[nombre] + '</svg>';
  }

  function moneda(tam) {
    const t = tam || 16;
    return '<svg class="moneda" width="' + t + '" height="' + t + '" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><rect x="2" y="0" width="4" height="8" fill="#FFB547"/><rect x="0" y="2" width="8" height="4" fill="#FFB547"/><rect x="1" y="1" width="6" height="6" fill="#FFB547"/><rect x="3" y="2" width="2" height="4" fill="#B8791F"/></svg>';
  }

  /** Barra superior con botón volver opcional. */
  function encabezado(titulo, volverA, extra) {
    return '<header class="barra">' +
      (volverA ? '<button type="button" class="boton-icono" data-accion="atras" data-pantalla="' + volverA + '" aria-label="Volver">' + icono('volver', 20, 2.5) + '</button>' : '') +
      '<h1 class="titulo-pixel">' + esc(titulo) + '</h1>' +
      '<div class="barra-extra">' + (extra || '') + '</div></header>';
  }

  function botonAjustes(volver) {
    return '<button type="button" class="boton-icono" data-accion="ir" data-pantalla="ajustes"' + (volver ? ' data-volver="' + volver + '"' : '') +
      ' aria-label="Configuración">' + icono('ajustes', 20) + '</button>';
  }

  function navEstudiante(activa) {
    const items = [
      ['hoy', 'Hoy', 'hoy'], ['examenes', 'Exámenes', 'examen'], ['pomodoro', 'Pomodoro', 'reloj'], ['materias', 'Materias', 'materias'], ['mascota', 'Mascota', 'mascota']
    ];
    return '<nav class="nav-inferior" aria-label="Secciones">' + items.map(([id, nombre, ic]) =>
      '<button type="button" class="nav-item' + (id === activa ? ' activo' : '') + '" data-accion="ir" data-pantalla="' + id + '"' +
      (id === activa ? ' aria-current="page"' : '') + '>' + icono(ic, 22) + '<span>' + nombre + '</span></button>'
    ).join('') + '</nav>';
  }

  function puntoMateria(materia) {
    return '<span class="punto" style="background:' + esc(materia ? materia.color : '#8A8FA3') + '"></span>';
  }

  /**
   * Fila de tarea con casillero.
   * opciones.modo: 'estudiante' (casillero para marcar) o 'lectura'.
   */
  function filaTarea(t, materia, opciones) {
    const op = opciones || {};
    const hoy = Fecha.hoy();
    const vencida = t.estado === 'pendiente' && t.vence < hoy;
    const enviada = t.estado === 'enviada';
    const etiquetaFecha = vencida ? 'venció ' + Fecha.relativa(t.vence) : (t.vence === hoy ? 'para hoy' : Fecha.relativa(t.vence));
    const meta = puntoMateria(materia) + '<span>' + esc(materia ? materia.nombre : 'Sin materia') + ' · ' + esc(etiquetaFecha) + '</span>' +
      (t.tipo === 'sesion' ? '<span class="chip-mini">Sesión de estudio</span>' : '') +
      (t.foto ? '<span class="chip-mini">Foto</span>' : '');
    let casillero = '';
    if (op.modo !== 'lectura' && (t.estado === 'pendiente' || enviada)) {
      casillero = '<button type="button" class="casillero' + (enviada ? ' marcado' : '') + '" data-accion="' + (enviada ? 'desmarcar' : 'marcar') + '" data-id="' + t.id + '" aria-label="' +
        esc((enviada ? 'Desmarcar: ' : 'Marcar como hecha: ') + t.titulo) + '">' + (enviada ? icono('check', 20, 3) : '') + '</button>';
    }
    return '<div class="fila-tarea' + (vencida ? ' vencida' : '') + (enviada ? ' enviada' : '') + '">' +
      '<button type="button" class="fila-cuerpo" data-accion="ir" data-pantalla="tarea" data-id="' + t.id + '">' +
      '<span class="meta">' + meta + '</span>' +
      '<span class="fila-titulo">' + esc(t.titulo) + '</span>' +
      (enviada ? '<span class="aviso-ok">Esperando aprobación</span>' : '') +
      (t.nota && t.estado === 'pendiente' ? '<span class="aviso-nota">Papá: ' + esc(t.nota) + '</span>' : '') +
      '</button>' + casillero + '</div>';
  }

  function barra(pct, color, etiqueta) {
    return '<div class="barra-progreso" role="progressbar" aria-label="' + esc(etiqueta || '') + '" aria-valuenow="' + Math.round(pct) + '" aria-valuemin="0" aria-valuemax="100">' +
      '<div style="width:' + util.limitar(pct, 0, 100) + '%;background:' + color + '"></div></div>';
  }

  /** Barra de vida en segmentos (corazones pixelados). */
  function vida(valor, max, chico) {
    const t = chico ? 12 : 18;
    let html = '<span class="vida' + (chico ? ' chica' : '') + '" role="img" aria-label="Vida: ' + valor + ' de ' + max + '">';
    for (let i = 0; i < max; i++) {
      const lleno = i < valor;
      const c = lleno ? (valor <= 2 ? '#FF7A6B' : '#FF5E7E') : '#33384C';
      html += '<svg width="' + t + '" height="' + t + '" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true">' +
        '<rect x="1" y="0" width="2" height="1" fill="' + c + '"/><rect x="4" y="0" width="2" height="1" fill="' + c + '"/>' +
        '<rect x="0" y="1" width="7" height="2" fill="' + c + '"/><rect x="1" y="3" width="5" height="1" fill="' + c + '"/>' +
        '<rect x="2" y="4" width="3" height="1" fill="' + c + '"/><rect x="3" y="5" width="1" height="1" fill="' + c + '"/>' +
        (lleno ? '<rect x="1" y="1" width="1" height="1" fill="#FFC2CF"/>' : '') + '</svg>';
    }
    return html + '</span>';
  }

  function vacio(texto, boton) {
    return '<div class="vacio"><p>' + texto + '</p>' + (boton || '') + '</div>';
  }

  AQ.ui = { icono, moneda, botonAjustes, encabezado, navEstudiante, puntoMateria, filaTarea, barra, vida, vacio };
})(globalThis.AQ = globalThis.AQ || {});

</script>
  <script>
/* js/views-estudiante.js */
/*
 * views-estudiante.js — Pantallas del estudiante y de inicio.
 * Cada vista recibe la app y devuelve el HTML de la pantalla.
 */
(function (AQ) {
  'use strict';

  const { Fecha, util, reglas, ui } = AQ;
  const esc = util.esc;
  const V = AQ.vistas = AQ.vistas || {};

  // ---------- Inicio ----------

  V.bienvenida = function () {
    return '<main class="pantalla centrada">' +
      '<div class="logo">' + ui.moneda(30) + '<span class="titulo-pixel grande">' + esc(AQ.NOMBRE_APP) + '</span></div>' +
      '<p class="texto-suave">La agenda escolar con mascota. Primero, el padre o la madre crea un PIN de 4 números para su panel de control.</p>' +
      '<form class="tarjeta formulario" data-form="crear-pin">' +
      '<label for="pin1">PIN del padre (4 números)</label>' +
      '<input id="pin1" name="pin1" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="new-password" required>' +
      '<label for="pin2">Repetí el PIN</label>' +
      '<input id="pin2" name="pin2" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="new-password" required>' +
      '<p class="texto-chico">El PIN evita que los chicos aprueben sus propias tareas. No es una contraseña segura: no uses la del banco.</p>' +
      '<button class="boton primario" type="submit">Crear PIN y seguir</button>' +
      '</form>' +
      '<p class="texto-chico centro">¿Tenés una copia de seguridad? <button type="button" class="enlace" data-accion="importar-inicio">Importar archivo</button> o <button type="button" class="enlace" data-accion="pegar-copia">pegar texto</button></p>' +
      '<input type="file" id="archivo-importar" accept="application/json,.json" hidden data-cambio="importar">' +
      '</main>';
  };

  V.perfiles = function (app) {
    const s = app.store;
    const tarjetas = s.perfiles.map((p) => {
      const m = s.mascota(p.id);
      const r = m.resumen;
      let estado = '<span class="ok">Todo al día</span>';
      if (r.tieneTareas && r.vida <= reglas.VIDA.DEBIL) estado = '<span class="mal">¡La mascota está débil!</span>';
      else if (r.tieneTareas && !r.comioHoy && !r.vacaciones) estado = '<span class="alerta">La mascota tiene hambre</span>';
      else if (r.vencidas) estado = '<span class="mal">' + r.vencidas + (r.vencidas === 1 ? ' vencida' : ' vencidas') + '</span>';
      else if (r.urgentes) estado = '<span class="alerta">' + r.urgentes + ' para hoy o mañana</span>';
      else if (!r.tieneTareas) estado = '<span class="texto-suave">Sin tareas todavía</span>';
      return '<button type="button" class="tarjeta-perfil" data-accion="entrar" data-id="' + p.id + '">' +
        AQ.dibujarMascota({ etapa: m.etapa, estado: m.estado, color: m.color, tamanio: 88 }) +
        '<span class="nombre-perfil">' + esc(p.nombre) + '</span>' +
        (r.tieneTareas ? ui.vida(m.vida, reglas.VIDA.MAX, true) : '') +
        '<span class="monedas">' + ui.moneda(14) + s.saldo(p.id) + '</span>' +
        '<span class="texto-chico">' + estado + '</span></button>';
    }).join('');
    return '<main class="pantalla">' +
      '<div class="logo">' + ui.moneda(28) + '<span class="titulo-pixel grande">' + esc(AQ.NOMBRE_APP) + '</span></div>' +
      '<h1 class="subtitulo">¿Quién va a estudiar hoy?</h1>' +
      (s.perfiles.length ? '<div class="grilla-perfiles">' + tarjetas + '</div>'
        : ui.vacio('Todavía no hay perfiles.', '<button type="button" class="boton primario" data-accion="pedir-pin" data-destino="perfil-form">Crear el primer perfil</button>')) +
      '<div class="espaciador"></div>' +
      '<button type="button" class="boton secundario ancho" data-accion="pedir-pin" data-destino="padre">' + ui.icono('candado', 18) + 'Panel del padre · pide PIN</button>' +
      '<p class="texto-chico centro">Los datos se guardan en este navegador.</p>' +
      '</main>';
  };

  // ---------- Hoy ----------

  function tarjetaMascota(app, grande) {
    const s = app.store;
    const m = s.mascota(app.perfilId);
    const feliz = app.felizActivo();
    const estado = feliz ? 'feliz' : m.estado;
    const info = reglas.TEXTO_ESTADO[estado];
    const mensaje = m.etapa === 'huevo'
      ? 'Soy un huevo. Anotá tu primera tarea y nazco.'
      : (feliz && app.mensajeFeliz) ? app.mensajeFeliz : reglas.mensajeMascota(estado, m.resumen, m.nombre);
    const costo = reglas.VIDA.COSTO_COMIDA;
    let comida = '';
    if (m.etapa !== 'huevo') {
      if (m.comioHoy) comida = '<span class="chip-mini ok">Ya comió hoy</span>';
      else if (s.saldo(app.perfilId) >= costo) comida = '<button type="button" class="boton primario chico boton-comida" data-accion="alimentar">Darle de comer · ' + ui.moneda(14) + costo + '</button>';
      else comida = '<button type="button" class="boton apagado chico boton-comida" disabled>Faltan ' + (costo - s.saldo(app.perfilId)) + ' para comida</button>';
      if (m.vacaciones) comida += '<span class="chip-mini">Modo vacaciones: no pierde vida</span>';
    }
    return '<section class="tarjeta-mascota' + (grande ? ' grande' : '') + '" style="background:' + m.fondo.css + '" aria-label="Tu mascota">' +
      '<div class="mascota-caja' + (feliz ? ' salta' : '') + '">' +
      AQ.dibujarMascota({ etapa: m.etapa, estado, color: m.color, tamanio: grande ? 144 : 96 }) +
      (feliz ? '<span class="chispas" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>' : '') +
      '</div>' +
      '<div class="mascota-info">' +
      '<div class="fila-entre"><span class="titulo-pixel">' + esc(m.nombre) + '</span><span class="estado-mascota" style="color:' + info.color + '">' + (m.etapa === 'huevo' ? 'Huevo' : info.nombre) + '</span></div>' +
      '<p class="mensaje-mascota" aria-live="polite">' + esc(mensaje) + '</p>' +
      (m.etapa === 'huevo' ? '' :
        '<div class="medidores"><span>Vida</span>' + ui.vida(m.vida, reglas.VIDA.MAX) +
        '<span>Ánimo</span>' + ui.barra(m.animo, '#6EC5FF', 'Ánimo') + '</div>' +
        '<div class="fila-comida">' + comida + '</div>') +
      '</div></section>';
  }

  function seccionTareas(titulo, clase, lista, app) {
    if (!lista.length) return '';
    return '<section class="seccion"><h2 class="titulo-seccion ' + clase + '">' + titulo + '</h2>' +
      lista.map((t) => ui.filaTarea(t, app.store.materia(t.materiaId))).join('') + '</section>';
  }

  V.hoy = function (app) {
    const s = app.store;
    const p = app.perfil();
    const hoy = Fecha.hoy();
    const manana = Fecha.sumarDias(hoy, 1);
    const tareas = s.tareasDe(p.id).slice().sort((a, b) => a.vence.localeCompare(b.vence));
    const pend = tareas.filter((t) => t.estado === 'pendiente');
    const vencidas = pend.filter((t) => t.vence < hoy);
    const paraHoy = pend.filter((t) => t.vence === hoy);
    const paraManana = pend.filter((t) => t.vence === manana);
    const proximos = pend.filter((t) => t.vence > manana);
    const enviadas = tareas.filter((t) => t.estado === 'enviada');
    const examenes = s.examenesDe(p.id).filter((x) => x.fecha >= hoy).slice(0, 2);
    const sinMaterias = s.materiasDe(p.id).length === 0;

    let cuerpo = '';
    if (sinMaterias) {
      cuerpo = ui.vacio('Para empezar, cargá las materias que tenés este año.',
        '<button type="button" class="boton primario" data-accion="ir" data-pantalla="materia-form">Agregar materias</button>');
    } else if (!pend.length && !enviadas.length) {
      cuerpo = ui.vacio('No tenés nada pendiente. Si te dieron tarea, anotala con el botón +.');
    }
    cuerpo += seccionTareas('Vencido', 'mal', vencidas, app) +
      seccionTareas('Para hoy', 'alerta', paraHoy, app) +
      seccionTareas('Para mañana', 'alerta', paraManana, app) +
      seccionTareas('Próximos días', '', proximos, app) +
      seccionTareas('Esperando aprobación', 'ok', enviadas, app);

    const tarjetasExamen = examenes.map((x) => {
      const mat = s.materia(x.materiaId);
      const ses = s.sesionesDe(x.id);
      const hechas = ses.filter((t) => t.estado !== 'pendiente').length;
      const faltan = Fecha.diferencia(hoy, x.fecha);
      return '<button type="button" class="tarjeta-examen" data-accion="ir" data-pantalla="examen" data-id="' + x.id + '">' +
        '<span class="etiqueta-azul">Examen · ' + (faltan === 0 ? 'hoy' : faltan === 1 ? 'mañana' : 'en ' + faltan + ' días') + '</span>' +
        '<span class="fila-titulo">' + esc(mat ? mat.nombre : '') + (x.temas ? ': ' + esc(x.temas) : '') + '</span>' +
        '<span class="texto-chico">' + esc(Fecha.larga(x.fecha)) + '</span>' +
        (ses.length ? '<span class="segmentos">' + ses.map((t) => '<i class="' + (t.estado !== 'pendiente' ? 'lleno' : '') + '"></i>').join('') + '</span>' +
          '<span class="texto-chico">Sesiones de estudio: ' + hechas + ' de ' + ses.length + '</span>' : '') +
        '</button>';
    }).join('');

    return '<main class="pantalla con-nav">' +
      '<header class="barra">' +
      ui.botonAjustes('hoy') +
      '<div class="saludo"><span class="texto-chico">' + esc(Fecha.larga(hoy)) + '</span><h1 class="titulo-pixel">Hola, ' + esc(p.nombre) + '</h1></div>' +
      '<button type="button" class="pastilla-monedas" data-accion="ir" data-pantalla="mascota" aria-label="Monedas: ' + s.saldo(p.id) + '. Ir a la tienda">' + ui.moneda(16) + s.saldo(p.id) + '</button>' +
      '</header>' +
      tarjetaMascota(app, false) +
      cuerpo +
      (tarjetasExamen ? '<section class="seccion"><h2 class="titulo-seccion azul">Próximos exámenes</h2>' + tarjetasExamen + '</section>' : '') +
      '<button type="button" class="fab" data-accion="ir" data-pantalla="' + (sinMaterias ? 'materia-form' : 'tarea-form') + '" aria-label="Anotar una tarea nueva">' + ui.icono('mas', 28, 3) + '</button>' +
      ui.navEstudiante('hoy') +
      '</main>';
  };

  // ---------- Formulario de tarea ----------

  V['tarea-form'] = function (app) {
    const s = app.store;
    const p = app.perfil();
    const edit = app.params.id ? s.tarea(app.params.id) : null;
    const esSesion = edit && edit.tipo === 'sesion';
    const materias = s.materiasDe(p.id);
    const materiaSel = edit ? edit.materiaId : (app.params.materiaId || (materias[0] && materias[0].id));
    const hoy = Fecha.hoy();
    const vence = edit ? edit.vence : Fecha.sumarDias(hoy, 1);
    const volver = app.params.volver || (edit ? 'tarea' : 'hoy');

    const chips = materias.map((m) =>
      '<label class="chip-radio"><input type="radio" name="materiaId" value="' + m.id + '"' + (m.id === materiaSel ? ' checked' : '') + (esSesion ? ' disabled' : '') + '>' +
      '<span>' + ui.puntoMateria(m) + esc(m.nombre) + '</span></label>').join('');

    const rapidas = [['Mañana', 1], ['Pasado', 2], ['En una semana', 7]].map(([n, d]) =>
      '<button type="button" class="chip" data-accion="fecha-rapida" data-valor="' + Fecha.sumarDias(hoy, d) + '">' + n + '</button>').join('');

    return '<main class="pantalla">' +
      ui.encabezado(edit ? (esSesion ? 'Mover sesión' : 'Editar tarea') : (app.modoPadre ? 'Tarea para ' + p.nombre : 'Nueva tarea'), volver) +
      (!edit && !app.modoPadre ? '<div class="aviso-monedas">' + ui.moneda(18) + '<span>Anotarla el mismo día que te la dan suma <strong>+' + reglas.MONEDAS.ANOTAR + '</strong></span></div>' : '') +
      '<form class="formulario" data-form="tarea">' +
      (esSesion ? '<p class="texto-suave">' + esc(edit.titulo) + '</p>' :
        '<fieldset><legend>Materia</legend><div class="grilla-chips">' + chips + '</div>' +
        '<button type="button" class="enlace" data-accion="ir" data-pantalla="materia-form" data-volver="tarea-form">+ Agregar otra materia</button></fieldset>' +
        '<label for="titulo">¿Qué hay que hacer?</label>' +
        '<input id="titulo" name="titulo" type="text" maxlength="120" required placeholder="Ej.: ejercicios 12 a 20, página 45" value="' + esc(edit ? edit.titulo : '') + '">' +
        '<label for="detalle">Detalles (opcional)</label>' +
        '<textarea id="detalle" name="detalle" rows="2" maxlength="500" placeholder="Ej.: en la carpeta, con letra prolija">' + esc(edit ? edit.detalle : '') + '</textarea>') +
      '<label for="vence">' + (esSesion ? 'Día de la sesión' : '¿Para cuándo?') + '</label>' +
      '<div class="fila-chips">' + rapidas + '</div>' +
      '<input id="vence" name="vence" type="date" required value="' + vence + '">' +
      (esSesion ? '' :
        '<div class="foto-campo">' +
        '<label class="boton secundario ancho" for="foto">' + ui.icono('camara', 20) + 'Foto del pizarrón (opcional)</label>' +
        '<input id="foto" type="file" accept="image/*" capture="environment" hidden data-cambio="foto">' +
        '<div id="foto-preview" class="foto-preview">' + (app.fotoTemporal ? '<img src="' + app.fotoTemporal + '" alt="Foto adjunta"><button type="button" class="enlace" data-accion="quitar-foto">Quitar foto</button>' : '') + '</div>' +
        '</div>') +

    const hoy = Fecha.hoy();

    const pestanas = '<div class="pestanas" role="tablist">' + perfiles.map((x) => {

    return '<main class="pantalla ancha">' + barraSup + pestanas +
      '<section class="tarjeta revision">' +
      '<div><h2 class="titulo-chico">Revisión diaria</h2><p class="texto-chico">Cinco minutos juntos: miren la lista y comparen con el cuaderno de comunicados o el grupo del curso. Cada 5 días seguidos, +' + reglas.MONEDAS.RACHA_REVISION + ' monedas.</p></div>' +

        const m = s.mascota(p.id);

        const e7 = s.estudio(p.id, 7);

  const esc = util.esc;
  const V = AQ.vistas = AQ.vistas || {};

  const RADIO = 108;
  const CIRCUNFERENCIA = 2 * Math.PI * RADIO;

  V.anilloPomodoro = { RADIO, CIRCUNFERENCIA };

  function chips(nombre, opciones, elegido, sufijo) {
    return opciones.map((n) =>
      '<label class="chip-radio chip-tiempo"><input type="radio" name="' + nombre + '" value="' + n + '"' + (n === elegido ? ' checked' : '') + '>' +
      '<span><b>' + n + '</b> ' + sufijo + '</span></label>').join('');
  }

  V.pomodoro = function (app) {
    const s = app.store;
    const T = app.temporizador;
    const p = app.perfil();
    const hoyMonedas = s.monedasPomodoroHoy(p.id);
    const tope = reglas.MONEDAS.TOPE_POMODORO_DIA;
    const estudio = s.estudio(p.id, 1);

    // Un pomodoro de otro perfil sigue corriendo en este dispositivo.
    if (T.activo && T.estado.perfilId !== p.id) {
      const otro = s.perfil(T.estado.perfilId);
      return '<main class="pantalla con-nav">' + ui.encabezado('Pomodoro', null, ui.botonAjustes('pomodoro')) +
        ui.vacio('Hay un pomodoro de ' + esc(otro ? otro.nombre : 'otro perfil') + ' en curso en este dispositivo.',
          '<button type="button" class="boton secundario" data-accion="pomo-terminar">Terminarlo</button>') +
        ui.navEstudiante('pomodoro') + '</main>';
    }

    if (!T.activo) {
      const pref = s.ajustes(p.id);
      const pendientes = s.tareasDe(p.id).filter((t) => t.estado === 'pendiente').sort((a, b) => a.vence.localeCompare(b.vence));
      const opcionesTarea = pendientes.map((t) => {
        const m = s.materia(t.materiaId);
        return '<option value="' + t.id + '">' + esc((m ? m.nombre + ': ' : '') + t.titulo) + '</option>';
      }).join('');
      return '<main class="pantalla con-nav">' + ui.encabezado('Pomodoro', null, ui.botonAjustes('pomodoro')) +
        '<p class="texto-suave">Estudiás sin distraerte un rato fijo y después descansás. Cada pomodoro completo suma monedas.</p>' +
        '<form class="formulario" data-form="pomodoro">' +
        '<fieldset><legend>¿Cuánto dura cada pomodoro?</legend><div class="grilla-tiempos">' + chips('foco', pomodoro.OPCIONES_FOCO, pref.foco, 'min') + '</div></fieldset>' +
        '<fieldset><legend>¿Y cada descanso?</legend><div class="grilla-tiempos tres">' + chips('descanso', pomodoro.OPCIONES_DESCANSO, pref.descanso, 'min') + '</div></fieldset>' +
        (opcionesTarea ? '<label for="tareaId">¿En qué vas a trabajar? (opcional)</label>' +
          '<select id="tareaId" name="tareaId"><option value="">Nada en particular</option>' + opcionesTarea + '</select>' : '') +
        '<div class="aviso-monedas">' + ui.moneda(18) + '<span>Suma <strong>1 moneda cada 5 minutos</strong> de foco (25 min = +5). Hoy llevás ' + hoyMonedas + ' de ' + tope + '.</span></div>' +
        '<button class="boton primario ancho grande" type="submit">' + ui.icono('reloj', 22) + 'Empezar</button>' +
        '</form>' +
        (estudio.pomodoros ? '<p class="texto-chico centro">Hoy: ' + estudio.pomodoros + (estudio.pomodoros === 1 ? ' pomodoro, ' : ' pomodoros, ') + estudio.minutos + ' minutos de foco.</p>' : '') +
        ui.navEstudiante('pomodoro') + '</main>';
    }

    const e = T.estado;
    const fase = e.fase;
    const tarea = e.tareaId ? s.tarea(e.tareaId) : null;
    const restante = T.restante();
    const total = T.total();
    const offset = fase === 'listo' ? 0 : CIRCUNFERENCIA * (1 - restante / total);
    const titulos = { foco: 'A concentrarse', descanso: 'Descanso', listo: '¡Descanso terminado!' };
    const color = fase === 'foco' ? 'var(--lima)' : 'var(--azul)';

    let botones;
    if (fase === 'listo') {
      botones = '<button type="button" class="boton primario ancho grande" data-accion="pomo-otro">Otro pomodoro de ' + e.foco + ' min</button>' +
        '<button type="button" class="boton secundario ancho" data-accion="pomo-terminar">Terminar por hoy</button>';
    } else {
      botones = (T.pausado
        ? '<button type="button" class="boton primario ancho grande" data-accion="pomo-reanudar">Seguir</button>'
        : '<button type="button" class="boton secundario ancho grande" data-accion="pomo-pausar">Pausar</button>') +
        (fase === 'descanso' ? '<button type="button" class="boton secundario ancho" data-accion="pomo-saltar">Saltar el descanso</button>' : '') +
        '<button type="button" class="boton peligro ancho" data-accion="pomo-terminar">Terminar</button>';
    }

    return '<main class="pantalla con-nav pomodoro-pantalla fase-' + fase + '">' +
      ui.encabezado('Pomodoro', null, '<span class="chip-mini">' + e.foco + ' + ' + e.descanso + ' min</span>') +
      '<section class="reloj-pomodoro" aria-label="Temporizador">' +
      '<p class="fase-pomodoro" style="color:' + color + '">' + titulos[fase] + (T.pausado ? ' · en pausa' : '') + '</p>' +
      '<div class="anillo">' +
      '<svg viewBox="0 0 240 240" aria-hidden="true">' +
      '<circle cx="120" cy="120" r="' + RADIO + '" fill="none" stroke="#262A3A" stroke-width="14"></circle>' +
      '<circle id="pomo-anillo" cx="120" cy="120" r="' + RADIO + '" fill="none" stroke="' + color + '" stroke-width="14" stroke-linecap="butt"' +
      ' stroke-dasharray="' + CIRCUNFERENCIA.toFixed(2) + '" stroke-dashoffset="' + offset.toFixed(2) + '" transform="rotate(-90 120 120)"></circle>' +
      '</svg>' +
      '<div class="anillo-centro">' +
      (fase === 'listo'
        ? AQ.dibujarMascota({ etapa: app.store.mascota(p.id).etapa, estado: 'feliz', color: app.store.mascota(p.id).color, tamanio: 96 })
        : '<span id="pomo-tiempo" class="tiempo-grande" role="timer" aria-live="off">' + pomodoro.formatear(restante) + '</span>' +
          '<span class="texto-chico">' + (fase === 'foco' ? 'para el descanso' : 'para volver') + '</span>') +
      '</div></div>' +
      (tarea ? '<p class="tarea-pomodoro">' + ui.puntoMateria(s.materia(tarea.materiaId)) + esc(tarea.titulo) + '</p>' : '') +
      '<p class="texto-chico centro">Pomodoros completos en esta sesión: <b>' + e.completados + '</b>' +
      (fase === 'foco' ? '<br>Al terminar este: +' + Math.min(Math.floor(e.foco / 5) * reglas.MONEDAS.POMODORO_POR_5_MIN, Math.max(0, tope - hoyMonedas)) + ' monedas' : '') + '</p>' +
      (fase === 'foco' ? '<p class="consejo">Dejá el celular boca abajo y la carpeta abierta. Si te acordás de algo, anotalo y seguí.</p>' : '') +
      (fase === 'descanso' ? '<p class="consejo">Levantate, tomá agua, estirate. Mejor sin pantallas.</p>' : '') +
      '</section>' +
      '<div class="acciones">' + botones + '</div>' +
      ui.navEstudiante('pomodoro') + '</main>';
  };
})(globalThis.AQ = globalThis.AQ || {});

</script>
  <script>
/* js/app.js */
/*
 * app.js — Controlador: navegación entre pantallas, eventos y arranque.
 *
 * Flujo: el usuario toca algo → un manejador llama al Store → el Store guarda
 * y avisa (Observer) → la App vuelve a dibujar la pantalla actual.
 */
(function (AQ) {
  'use strict';

  const { Fecha } = AQ;

  const PANTALLAS_PADRE = ['padre', 'padre-ajustes', 'perfil-form', 'premio-form'];
  const PANTALLAS_ESTUDIANTE = ['hoy', 'tarea-form', 'tarea', 'examenes', 'examen-form', 'examen', 'materias', 'materia-form', 'mascota', 'pomodoro', 'ajustes'];
  const TITULOS = {
    hoy: 'Hoy', perfiles: 'Perfiles', padre: 'Panel del padre', mascota: 'Mascota', examenes: 'Exámenes', materias: 'Materias', pomodoro: 'Pomodoro', ajustes: 'Configuración'
  };

  function almacenSeguro() {
    try { return globalThis.localStorage || null; } catch (e) { return null; }
  }

  /** Achica la foto para que entre en el almacenamiento del navegador. */
  function comprimirImagen(archivo, maximo, calidad) {
    return new Promise((resolver, rechazar) => {
      const lector = new FileReader();
      lector.onerror = () => rechazar(new Error('No se pudo leer la foto.'));
      lector.onload = () => {
        const img = new Image();
        img.onerror = () => rechazar(new AQ.ErrorValidacion('Ese archivo no parece una imagen.'));
        img.onload = () => {
          const escala = Math.min(1, maximo / Math.max(img.width, img.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * escala);
          canvas.height = Math.round(img.height * escala);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          resolver(canvas.toDataURL('image/jpeg', calidad));
        };
        img.src = lector.result;
      };
      lector.readAsDataURL(archivo);
    });
  }

  function descargar(nombre, texto) {
    const blob = new Blob([texto], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = nombre;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  class App {
    constructor(store, raiz, zonaAvisos, zonaDialogo) {
      this.store = store;
      this.raiz = raiz;
      this.zonaAvisos = zonaAvisos;
      this.zonaDialogo = zonaDialogo;
      this.pantalla = 'perfiles';
      this.params = {};
      this.perfilId = null;
      this.padreDesbloqueado = false;
      this.historial = [];
      this.devolviendo = null;
      this.felizHasta = 0;
      this.fotoTemporal = null;
      this.temporizador = new AQ.Temporizador(almacenSeguro());
      this.sonido = new AQ.Sonido();
      this.barraPomodoro = document.getElementById('pomo-barra');
      this.mensajeFeliz = null;
      this.diaActual = Fecha.hoy();
      this.store.suscribir(() => this.render());
      this._escuchar();
      this._iniciarReloj();
    }

    // ---------- Pomodoro ----------
    _iniciarReloj() {
      setInterval(() => this._tickPomodoro(), 500);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          this._tickPomodoro();
          if (this.temporizador.activo) this._mantenerPantalla(true);
        }
      });
      if (this.barraPomodoro) {
        this.barraPomodoro.addEventListener('click', (ev) => {
          if (!ev.target.closest('button')) return;
          if (this.temporizador.activo) this.perfilId = this.temporizador.estado.perfilId;
          this.ir('pomodoro');
        });
      }
    }

    /** Descuenta vida por los días sin comer. Avisa si la mascota del perfil actual perdió vida. */
    _actualizarVidas() {
      this.store.perfiles.forEach((p) => {
        const perdidas = this.store.actualizarVida(p.id);
        if (perdidas && p.id === this.perfilId && !this.modoPadre) {
          this.aviso(p.mascota.nombre + ' pasó ' + perdidas + (perdidas === 1 ? ' día' : ' días') + ' sin comer y perdió ' + perdidas + ' de vida. ¡Dale de comer!', 'error');
        }
      });
    }

    _tickPomodoro() {
      if (this.diaActual !== Fecha.hoy()) {
        // Pasó la medianoche con la app abierta.
        this.diaActual = Fecha.hoy();
        this._actualizarVidas();
        this.render();
      }
      const T = this.temporizador;
      if (!T.activo) { this._pintarPomodoro(); return; }
      const ev = T.tick();
      if (!ev) { this._pintarPomodoro(); return; }
      if (ev.tipo === 'foco-completo') {
        let monedas = 0;
        try { monedas = this.store.registrarPomodoro(ev.perfilId, ev.minutos, ev.tareaId); } catch (e) { console.error(e); }
        if (this._sonidoActivo(ev.perfilId)) this.sonido.tocar(true);
        if (ev.perfilId === this.perfilId) { this.felizHasta = Date.now() + 3500; this.mensajeFeliz = '¡Pomodoro completo! Ahora a descansar.'; }
        this.aviso(monedas > 0
          ? '¡Pomodoro completo! +' + monedas + ' monedas. Ahora, ' + T.estado.descanso + ' min de descanso.'
          : '¡Pomodoro completo! Ya llegaste al tope de monedas de hoy, pero el estudio cuenta igual.', 'ok');
      } else {
        if (this._sonidoActivo(T.estado && T.estado.perfilId)) this.sonido.tocar(false);
        this.aviso('Terminó el descanso. ¿Otro pomodoro?', 'ok');
      }
      this.render();
    }

    /** Actualiza el reloj, el anillo, la barra fija y el título sin redibujar la pantalla. */
    _pintarPomodoro() {
      const T = this.temporizador;
      const barra = this.barraPomodoro;
      const texto = T.activo && T.estado.fase !== 'listo' ? AQ.pomodoro.formatear(T.restante()) : '';
      const reloj = this.raiz.querySelector('#pomo-tiempo');
      if (reloj && reloj.textContent !== texto) reloj.textContent = texto;
      const anillo = this.raiz.querySelector('#pomo-anillo');
      if (anillo && T.activo) {
        const C = AQ.vistas.anilloPomodoro.CIRCUNFERENCIA;
        anillo.setAttribute('stroke-dashoffset', (C * (1 - T.restante() / T.total())).toFixed(2));
      }
      const fases = { foco: 'Foco', descanso: 'Descanso', listo: 'Listo' };
      const base = (TITULOS[this.pantalla] ? TITULOS[this.pantalla] + ' · ' : '') + AQ.NOMBRE_APP;
      document.title = T.activo ? (texto ? texto + ' ' : '') + fases[T.estado.fase] + ' · ' + base : base;

      if (!barra) return;
      // Visible en todas las pantallas menos la del propio pomodoro, que ya lo muestra grande.
      const mostrar = T.activo && this.pantalla !== 'pomodoro';
      barra.hidden = !mostrar;
      document.body.classList.toggle('con-barra-pomo', mostrar);
      if (!mostrar) return;
      const e = T.estado;
      const perfil = this.store.perfil(e.perfilId);
      const etiqueta = e.fase === 'listo' ? 'Descanso terminado · ¿otro?' : fases[e.fase] + (T.pausado ? ' (pausa)' : '');
      const html = '<button type="button" class="pomo-barra-boton fase-' + e.fase + '" aria-label="Ir al pomodoro">' +
        '<span class="pomo-punto"></span><span class="pomo-etiqueta">' + AQ.util.esc(etiqueta) +
        (perfil && e.perfilId !== this.perfilId ? ' · ' + AQ.util.esc(perfil.nombre) : '') + '</span>' +
        '<span class="pomo-barra-tiempo">' + texto + '</span><span class="pomo-ver">Ver</span></button>';
      if (barra.dataset.html !== html) { barra.innerHTML = html; barra.dataset.html = html; }
    }

    /** Aplica tamaño de letra y animaciones del perfil activo (en el panel del padre, los valores normales). */
    _aplicarAjustes() {
      const usar = this.perfil() && !this.modoPadre && PANTALLAS_ESTUDIANTE.includes(this.pantalla);
      const a = usar ? this.store.ajustes(this.perfilId) : AQ.Repositorio.ajustesBase();
      document.documentElement.dataset.letra = a.letra;
      document.body.classList.toggle('sin-animaciones', !a.animaciones);
    }

    _sonidoActivo(perfilId) {
      return this.store.ajustes(perfilId || this.perfilId).sonido !== false;
    }

    /** Pide que la pantalla no se apague durante el pomodoro (si el navegador lo permite). */
    _mantenerPantalla(si) {
      try {
        if (si && navigator.wakeLock && !this.bloqueoPantalla) {
          navigator.wakeLock.request('screen').then((b) => {
            this.bloqueoPantalla = b;
            b.addEventListener('release', () => { this.bloqueoPantalla = null; });
          }).catch(() => {});
        }
        if (!si && this.bloqueoPantalla) { this.bloqueoPantalla.release().catch(() => {}); this.bloqueoPantalla = null; }
      } catch (e) { /* no disponible */ }
    }

    get modoPadre() { return this.padreDesbloqueado; }
    perfil() { return this.store.perfil(this.perfilId); }
    felizActivo() { return Date.now() < this.felizHasta; }

    iniciar() {
      this._actualizarVidas();
      this.ir(this.store.tienePin() ? 'perfiles' : 'bienvenida', {}, { sinHistorial: true });
    }

    /** Navegar a una pantalla. opciones: sinHistorial (no guardar la actual), reemplazar. */
    ir(pantalla, params, opciones) {
      const op = opciones || {};
      params = params || {};
      if (PANTALLAS_PADRE.includes(pantalla) && !this.padreDesbloqueado) {
        return this.ir('pin', { destino: pantalla }, op);
      }
      if (PANTALLAS_ESTUDIANTE.includes(pantalla) && !this.perfil()) {
        return this.ir('perfiles', {}, { sinHistorial: true });
      }
      if (!op.sinHistorial && !op.reemplazar && this.pantalla !== pantalla) {
        this.historial.push({ pantalla: this.pantalla, params: this.params });
        if (this.historial.length > 30) this.historial.shift();
      }
      if (pantalla === 'tarea-form') {
        const t = params.id ? this.store.tarea(params.id) : null;
        this.fotoTemporal = t ? t.foto : null;
      }
      this.pantalla = pantalla;
      this.params = params;
      this.devolviendo = null;
      this.render();
      window.scrollTo(0, 0);
      const titulo = this.raiz.querySelector('h1');
      const conFoco = this.raiz.querySelector('[autofocus]');
      if (conFoco) conFoco.focus();
      else if (titulo) { titulo.setAttribute('tabindex', '-1'); titulo.focus({ preventScroll: true }); }
    }

    atras(respaldo) {
      const anterior = this.historial.pop();
      if (anterior) this.ir(anterior.pantalla, anterior.params, { sinHistorial: true });
      else this.ir(respaldo || 'perfiles', {}, { sinHistorial: true });
    }

    render() {
      const vista = AQ.vistas[this.pantalla];
      this.raiz.innerHTML = vista ? vista(this) : '';
      this.raiz.dataset.pantalla = this.pantalla;
      this._aplicarAjustes();
      this._pintarPomodoro();
    }

    /**
     * Diálogo propio (en lugar de confirm/prompt del navegador, que algunos visores bloquean).
     * op: { titulo, mensaje, confirmar, cancelar, peligro, escribir (texto exacto a tipear),
     *       area (true: campo de texto grande), valor, soloLectura }
     * Devuelve una promesa: true (o el texto ingresado) si confirma, false si cancela.
     */
    dialogo(op) {
      const zona = this.zonaDialogo;
      const previo = document.activeElement;
      const esc = AQ.util.esc;
      const conCampo = op.escribir || op.area;
      zona.innerHTML =
        '<div class="fondo-dialogo">' +
        '<div class="dialogo" role="dialog" aria-modal="true" aria-labelledby="dialogo-titulo">' +
        '<h2 id="dialogo-titulo" class="titulo-chico">' + esc(op.titulo) + '</h2>' +
        (op.mensaje ? '<p class="texto-suave">' + esc(op.mensaje) + '</p>' : '') +
        (op.escribir ? '<label for="dialogo-campo" class="texto-chico">Escribí <b>' + esc(op.escribir) + '</b> para confirmar</label><input id="dialogo-campo" type="text" autocomplete="off">' : '') +
        (op.area ? '<textarea id="dialogo-campo" rows="8"' + (op.soloLectura ? ' readonly' : '') + ' aria-label="' + esc(op.titulo) + '">' + esc(op.valor || '') + '</textarea>' : '') +
        '<div class="fila-botones">' +
        (op.cancelar === null ? '' : '<button type="button" class="boton secundario" data-dialogo="no">' + esc(op.cancelar || 'Cancelar') + '</button>') +
        '<button type="button" class="boton ' + (op.peligro ? 'peligro-lleno' : 'primario') + ' confirmar" data-dialogo="si">' + esc(op.confirmar || 'Aceptar') + '</button>' +
        '</div></div></div>';
      const campo = zona.querySelector('#dialogo-campo');
      const botonSi = zona.querySelector('[data-dialogo="si"]');
      (campo && !op.soloLectura ? campo : botonSi).focus();
      if (campo && op.soloLectura) campo.select();
      return new Promise((resolver) => {
        const cerrar = (valor) => {
          zona.innerHTML = '';
          document.removeEventListener('keydown', tecla, true);
          if (previo && document.body.contains(previo)) previo.focus();
          resolver(valor);
        };
        const tecla = (ev) => {
          if (ev.key === 'Escape') { ev.preventDefault(); cerrar(false); }
          if (ev.key === 'Tab') {
            const focos = Array.from(zona.querySelectorAll('button, input, textarea'));
            const i = focos.indexOf(document.activeElement);
            if (ev.shiftKey && i <= 0) { ev.preventDefault(); focos[focos.length - 1].focus(); }
            else if (!ev.shiftKey && i === focos.length - 1) { ev.preventDefault(); focos[0].focus(); }
          }
          if (ev.key === 'Enter' && campo && campo.tagName === 'INPUT') { ev.preventDefault(); botonSi.click(); }
        };
        document.addEventListener('keydown', tecla, true);
        zona.querySelector('.fondo-dialogo').addEventListener('click', (ev) => {
          const b = ev.target.closest('[data-dialogo]');
          if (ev.target.classList.contains('fondo-dialogo')) return cerrar(false);
          if (!b) return;
          if (b.dataset.dialogo === 'no') return cerrar(false);
          if (op.escribir) {
            if (campo.value.trim().toUpperCase() !== op.escribir) { campo.focus(); campo.setAttribute('aria-invalid', 'true'); return; }
            return cerrar(true);
          }
          cerrar(op.area && !op.soloLectura ? campo.value : true);
        });
      });
    }

    aviso(texto, tipo) {
      while (this.zonaAvisos.children.length >= 2) this.zonaAvisos.firstElementChild.remove();
      const el = document.createElement('div');
      el.className = 'aviso ' + (tipo || '');
      el.setAttribute('role', tipo === 'error' ? 'alert' : 'status');
      el.textContent = texto;
      this.zonaAvisos.appendChild(el);
      setTimeout(() => el.classList.add('saliendo'), 3200);
      setTimeout(() => el.remove(), 3600);
    }

    _proteger(fn) {
      try {
        const r = fn();
        if (r && typeof r.catch === 'function') r.catch((e) => this._error(e));
      } catch (e) { this._error(e); }
    }

    _error(e) {
      if (e instanceof AQ.ErrorValidacion || e instanceof AQ.ErrorAlmacenamiento) this.aviso(e.message, 'error');
      else { console.error(e); this.aviso('Algo salió mal. Probá de nuevo.', 'error'); }
    }

    _escuchar() {
      this.raiz.addEventListener('click', (ev) => {
        const el = ev.target.closest('[data-accion]');
        if (!el || el.disabled) return;
        const fn = this.acciones[el.dataset.accion];
        if (fn) { ev.preventDefault(); this._proteger(() => fn.call(this, el)); }
      });
      this.raiz.addEventListener('submit', (ev) => {
        const form = ev.target.closest('form[data-form]');
        if (!form) return;
        ev.preventDefault();
        const fn = this.formularios[form.dataset.form];
        const datos = Object.fromEntries(new FormData(form).entries());
        if (ev.submitter && ev.submitter.name) datos[ev.submitter.name] = ev.submitter.value;
        if (fn) this._proteger(() => fn.call(this, form, datos));
      });
      this.raiz.addEventListener('change', (ev) => {
        const el = ev.target.closest('[data-cambio]');
        if (!el) return;
        const fn = this.cambios[el.dataset.cambio];
        if (fn) this._proteger(() => fn.call(this, el));
      });
    }

    _importarTexto(texto) {
      this.store.importar(texto);
      this.padreDesbloqueado = false;
      this.perfilId = null;
      this.historial = [];
      this.iniciar();
      this.aviso('Copia importada.', 'ok');
    }

    _entrarComoPadre() {
      this.padreDesbloqueado = true;
      let bonos = 0;
      this.store.perfiles.forEach((p) => { bonos += this.store.evaluarSemanas(p.id); });
      if (bonos) this.aviso('Se acreditaron bonos de semana sin vencidas.', 'ok');
      if (!this.perfilId && this.store.perfiles[0]) this.perfilId = this.store.perfiles[0].id;
    }
  }

  // ---------- Acciones (clics) ----------
  App.prototype.acciones = {
    ir(el) {
      const params = {};
      if (el.dataset.id) params.id = el.dataset.id;
      if (el.dataset.volver) params.volver = el.dataset.volver;
      this.ir(el.dataset.pantalla, params);
    },
    atras(el) { this.atras(el.dataset.pantalla); },

    entrar(el) {
      this.perfilId = el.dataset.id;
      this.padreDesbloqueado = false;
      this.historial = [];
      this._actualizarVidas();
      const bono = this.store.evaluarSemanas(this.perfilId);
      this.ir('hoy', {}, { sinHistorial: true });
      if (bono) this.aviso('¡Bono! +' + bono + ' monedas por semanas sin tareas vencidas.', 'ok');
    },

    'pedir-pin'(el) {
      if (this.padreDesbloqueado) this.ir(el.dataset.destino);
      else this.ir('pin', { destino: el.dataset.destino });
    },

    marcar(el) {
      this.store.marcarHecha(el.dataset.id);
      this.felizHasta = Date.now() + 3500;
      this.mensajeFeliz = '¡Bien ahí! Cuando tu papá la apruebe, sumás monedas.';
      if (this.pantalla === 'tarea') this.atras('hoy');
      else this.render();
      setTimeout(() => { if (!this.felizActivo()) this.render(); }, 3600);
      this.aviso('¡Bien! Ahora tu papá la revisa.', 'ok');
    },

    desmarcar(el) {
      this.store.desmarcar(el.dataset.id);
      this.felizHasta = 0;
    },

    async 'borrar-tarea'(el) {
      const t = this.store.tarea(el.dataset.id);
      if (!t) return;
      const descuento = t.creadaPor === 'estudiante' ? 'Se descuentan las ' + AQ.reglas.MONEDAS.ANOTAR + ' monedas que dio anotarla.' : '';
      if (!await this.dialogo({ titulo: '¿Borrar "' + t.titulo + '"?', mensaje: descuento, confirmar: 'Borrar', peligro: true })) return;
      this.store.eliminarTarea(t.id);
      if (this.pantalla === 'tarea') this.atras(this.modoPadre ? 'padre' : 'hoy');
      this.aviso('Tarea borrada.');
    },

    'fecha-rapida'(el) {
      const input = this.raiz.querySelector('#vence');
      if (input) input.value = el.dataset.valor;
    },

    'quitar-foto'() {
      this.fotoTemporal = null;
      const prev = this.raiz.querySelector('#foto-preview');
      if (prev) prev.innerHTML = '';
    },

    async 'borrar-examen'(el) {
      if (!await this.dialogo({ titulo: '¿Borrar el examen?', mensaje: 'También se borran las sesiones de estudio que no se aprobaron.', confirmar: 'Borrar', peligro: true })) return;
      this.store.eliminarExamen(el.dataset.id);
      this.atras(this.modoPadre ? 'padre' : 'examenes');
    },

    async 'borrar-materia'(el) {
      const m = this.store.materia(el.dataset.id);
      if (!m || !await this.dialogo({ titulo: '¿Borrar la materia ' + m.nombre + '?', confirmar: 'Borrar', peligro: true })) return;
      this.store.eliminarMateria(m.id);
      this.atras('materias');
    },

    async canjear(el) {
      const pr = this.store.premios.find((x) => x.id === el.dataset.id);
      if (!pr || !await this.dialogo({ titulo: '¿Canjear "' + pr.nombre + '"?', mensaje: 'Cuesta ' + pr.precio + ' monedas. Después avisale a tu papá.', confirmar: 'Canjear' })) return;
      this.store.canjear(this.perfilId, pr.id);
      this.aviso('¡Canjeado! Avisale a tu papá para que te lo dé.', 'ok');
    },

    alimentar() {
      const recupero = this.store.alimentar(this.perfilId);
      this.felizHasta = Date.now() + 3500;
      this.mensajeFeliz = recupero ? '¡Ñam, qué rico! Recuperé 1 de vida.' : '¡Ñam, qué rico! Gracias.';
      this.render();
      setTimeout(() => { if (!this.felizActivo()) this.render(); }, 3600);
    },

    vacaciones(el) {
      const activo = el.dataset.valor === '1';
      this.store.ponerVacaciones(this.perfilId, activo);
      this.aviso(activo ? 'Modo vacaciones activado: la mascota no pierde vida.' : 'Modo vacaciones terminado. Desde mañana vuelve a necesitar comida.', 'ok');
    },

    comprar(el) {
      this.store.comprarCosmetico(this.perfilId, el.dataset.tipo, el.dataset.id);
      this.felizHasta = Date.now() + 2500;
      this.mensajeFeliz = '¡Me encanta mi nuevo look!';
      this.render();
      this.aviso('¡Nuevo look para tu mascota!', 'ok');
    },

    equipar(el) { this.store.equipar(this.perfilId, el.dataset.tipo, el.dataset.id); },

    'elegir-perfil-padre'(el) {
      this.perfilId = el.dataset.id;
      this.devolviendo = null;
      this.render();
    },

    revision() {
      const r = this.store.registrarRevision(this.perfilId);
      this.aviso(r.bono ? '¡Racha de ' + r.racha + ' días! +' + r.bono + ' monedas.' : 'Revisión registrada. Racha: ' + r.racha + (r.racha === 1 ? ' día.' : ' días.'), 'ok');
    },

    aprobar(el) {
      const t = this.store.tarea(el.dataset.id);
      const monto = this.store.aprobar(el.dataset.id);
      const p = this.store.perfil(t.perfilId);
      this.aviso('Aprobada: +' + monto + ' monedas para ' + p.nombre + '.', 'ok');
    },

    devolver(el) {
      this.devolviendo = el.dataset.id;
      this.render();
      const input = this.raiz.querySelector('.form-devolver input');
      if (input) input.focus();
    },

    'cancelar-devolver'() { this.devolviendo = null; this.render(); },

    entregado(el) { this.store.marcarEntregado(el.dataset.id); this.aviso('Canje marcado como entregado.', 'ok'); },

    async 'cancelar-canje'(el) {
      if (!await this.dialogo({ titulo: '¿Cancelar el canje?', mensaje: 'Las monedas vuelven al saldo.', confirmar: 'Cancelar canje', cancelar: 'Volver', peligro: true })) return;
      this.store.cancelarCanje(el.dataset.id);
      this.aviso('Canje cancelado, monedas devueltas.');
    },

    'pomo-pausar'() { this.temporizador.pausar(); this.render(); },
    'pomo-reanudar'() { this.sonido.preparar(); this.temporizador.reanudar(); this._mantenerPantalla(true); this.render(); },
    'pomo-saltar'() { this.temporizador.saltarDescanso(); this.render(); },
    'pomo-otro'() {
      this.sonido.preparar();
      this.temporizador.otro();
      this._mantenerPantalla(true);
      this.render();
    },
    async 'pomo-terminar'() {
      const T = this.temporizador;
      if (T.activo && T.estado.fase === 'foco' && !await this.dialogo({
        titulo: '¿Terminar el pomodoro?', mensaje: 'Si lo cortás ahora, este pomodoro no suma monedas.', confirmar: 'Terminar', cancelar: 'Seguir estudiando', peligro: true
      })) return;
      const hechos = T.activo ? T.estado.completados : 0;
      T.terminar();
      this._mantenerPantalla(false);
      this.render();
      if (hechos) this.aviso('¡Bien! Completaste ' + hechos + (hechos === 1 ? ' pomodoro.' : ' pomodoros.'), 'ok');
    },

    'salir-perfil'() {
      this.perfilId = null;
      this.historial = [];
      this.ir('perfiles', {}, { sinHistorial: true });
      this.aviso('Saliste de tu cuenta. ¡Hasta la próxima!', 'ok');
    },

    'probar-sonido'() {
      this.sonido.preparar();
      this.sonido.tocar(true);
    },

    'salir-padre'() {
      this.padreDesbloqueado = false;
      this.historial = [];
      this.ir('perfiles', {}, { sinHistorial: true });
    },

    exportar() {
      // Dentro de un visor embebido (iframe) las descargas suelen estar bloqueadas: se ofrece copiar el texto.
      if (window.self !== window.top) return this.acciones['copiar-copia'].call(this);
      descargar('agendaquest-copia-' + Fecha.hoy() + '.json', this.store.exportar());
      this.aviso('Si no apareció la descarga, usá "Copiar copia como texto".', 'ok');
    },

    async 'copiar-copia'() {
      const texto = this.store.exportar();
      try {
        await navigator.clipboard.writeText(texto);
        this.aviso('Copia copiada. Pegala en un archivo de texto o en un mail para vos.', 'ok');
      } catch (e) {
        await this.dialogo({ titulo: 'Copia de seguridad', mensaje: 'Seleccioná todo el texto y copialo a un lugar seguro.', area: true, valor: texto, soloLectura: true, confirmar: 'Listo', cancelar: null });
      }
    },

    async 'pegar-copia'() {
      const texto = await this.dialogo({ titulo: 'Pegar copia de seguridad', mensaje: 'Pegá el texto de una copia. Reemplaza todos los datos actuales de este navegador.', area: true, confirmar: 'Importar', peligro: true });
      if (!texto) return;
      this._importarTexto(texto);
    },

    importar() { const i = this.raiz.querySelector('#archivo-importar'); if (i) i.click(); },
    'importar-inicio'() { const i = this.raiz.querySelector('#archivo-importar'); if (i) i.click(); },

    async 'borrar-fotos'() {
      if (!await this.dialogo({ titulo: '¿Borrar fotos de tareas aprobadas?', mensaje: 'Libera espacio. Las tareas quedan, solo se borran sus fotos.', confirmar: 'Borrar fotos', peligro: true })) return;
      const n = this.store.borrarFotosAprobadas();
      this.aviso(n ? 'Se borraron ' + n + (n === 1 ? ' foto.' : ' fotos.') : 'No había fotos para borrar.');
    },

    async 'borrar-todo'() {
      const ok = await this.dialogo({ titulo: '¿Borrar todos los datos?', mensaje: 'Se borran perfiles, tareas, exámenes, monedas y el PIN. No se puede deshacer.', escribir: 'BORRAR', confirmar: 'Borrar todo', peligro: true });
      if (!ok) return;
      this.store.borrarTodo();
      this.padreDesbloqueado = false;
      this.perfilId = null;
      this.historial = [];
      this.iniciar();
    },

    async 'borrar-perfil'(el) {
      const p = this.store.perfil(el.dataset.id);
      if (!p || !await this.dialogo({ titulo: '¿Borrar el perfil de ' + p.nombre + '?', mensaje: 'Se borran sus tareas, exámenes, monedas y mascota. No se puede deshacer.', escribir: 'BORRAR', confirmar: 'Borrar perfil', peligro: true })) return;
      this.store.eliminarPerfil(p.id);
      if (this.perfilId === p.id) this.perfilId = this.store.perfiles[0] ? this.store.perfiles[0].id : null;
      this.atras('padre-ajustes');
    },

    async 'borrar-premio'(el) {
      if (!await this.dialogo({ titulo: '¿Borrar este premio?', confirmar: 'Borrar', peligro: true })) return;
      this.store.eliminarPremio(el.dataset.id);
      this.atras('padre-ajustes');
    }
  };

  // ---------- Formularios ----------
  App.prototype.formularios = {
    'crear-pin'(form, d) {
      if (d.pin1 !== d.pin2) throw new AQ.ErrorValidacion('Los dos PIN no coinciden.');
      this.store.configurarPin(d.pin1);
      this.padreDesbloqueado = true;
      this.ir('perfil-form', {}, { sinHistorial: true });
    },

    pin(form, d) {
      if (!this.store.verificarPin(d.pin)) {
        this.ir('pin', { destino: this.params.destino, error: true }, { reemplazar: true });
        return;
      }
      this._entrarComoPadre();
      this.ir(this.params.destino || 'padre', {}, { reemplazar: true });
    },

    tarea(form, d) {
      if (this.params.id) {
        const t = this.store.tarea(this.params.id);
        const cambios = t.tipo === 'sesion' ? { vence: d.vence } : { titulo: d.titulo, detalle: d.detalle, vence: d.vence, materiaId: d.materiaId, foto: this.fotoTemporal };
        this.store.editarTarea(t.id, cambios);
        this.aviso('Cambios guardados.', 'ok');
        this.atras(this.modoPadre ? 'padre' : 'hoy');
        return;
      }
      const eraHuevo = this.store.mascota(this.perfilId).etapa === 'huevo';
      this.store.agregarTarea(this.perfilId, { materiaId: d.materiaId, titulo: d.titulo, detalle: d.detalle, vence: d.vence, foto: this.fotoTemporal }, this.modoPadre);
      this.fotoTemporal = null;
      if (this.modoPadre) {
        this.aviso('Tarea agregada.', 'ok');
      } else {
        this.felizHasta = Date.now() + 3000;
        this.mensajeFeliz = eraHuevo ? '¡Hola! Acabo de nacer. Dame de comer una vez por día.' : '¡Anotada! Así no se te olvida.';
        setTimeout(() => { if (!this.felizActivo()) this.render(); }, 3100);
        this.aviso(eraHuevo ? '¡Nació tu mascota! +' + AQ.reglas.MONEDAS.ANOTAR + ' monedas.' : 'Anotada. +' + AQ.reglas.MONEDAS.ANOTAR + ' monedas.', 'ok');
      }
      this.atras(this.modoPadre ? 'padre' : 'hoy');
    },

    examen(form, d) {
      const x = this.store.agregarExamen(this.perfilId, d);
      this.aviso('Examen agendado con su plan de estudio.', 'ok');
      this.ir('examen', { id: x.id }, { reemplazar: true });
    },

    'nota-examen'(form, d) {
      this.store.editarExamen(form.dataset.id, { nota: d.nota });
      this.aviso('Nota guardada.', 'ok');
    },

    materia(form, d) {
      if (this.params.id) {
        this.store.editarMateria(this.params.id, d);
        this.aviso('Materia guardada.', 'ok');
        this.atras('materias');
        return;
      }
      this.store.agregarMateria(this.perfilId, d);
      this.aviso(d.nombre.trim() + ' agregada.', 'ok');
      if (d.otra) this.ir('materia-form', { volver: this.params.volver }, { reemplazar: true });
      else this.atras('materias');
    },

    perfil(form, d) {
      const primero = this.store.perfiles.length === 0;
      if (this.params.id) {
        this.store.editarPerfil(this.params.id, d);
        this.aviso('Perfil guardado.', 'ok');
        this.atras('padre-ajustes');
        return;
      }
      const p = this.store.agregarPerfil(d);
      this.perfilId = p.id;
      this.aviso('Perfil de ' + p.nombre + ' creado.', 'ok');
      if (primero) {
        this.padreDesbloqueado = false;
        this.historial = [];
        this.ir('perfiles', {}, { sinHistorial: true });
      } else {
        this.atras('padre-ajustes');
      }
    },

    premio(form, d) {
      if (this.params.id) this.store.editarPremio(this.params.id, d);
      else this.store.agregarPremio(d);
      this.aviso('Premio guardado.', 'ok');
      this.atras('padre-ajustes');
    },

    devolver(form, d) {
      this.store.devolver(form.dataset.id, d.nota);
      this.devolviendo = null;
      this.render();
      this.aviso('Tarea devuelta con tu nota.');
    },

    pomodoro(form, d) {
      this.sonido.preparar();
      this.temporizador.iniciar(this.perfilId, d.foco, d.descanso, d.tareaId || null);
      // La última elección queda como predeterminada para la próxima vez.
      try { this.store.editarAjustes(this.perfilId, { foco: d.foco, descanso: d.descanso }); } catch (e) { /* no es grave */ }
      this._mantenerPantalla(true);
      this.render();
      window.scrollTo(0, 0);
    },

    'nombre-mascota'(form, d) {
      this.store.renombrarMascota(this.perfilId, d.nombre);
      this.aviso('Ahora tu mascota se llama ' + d.nombre.trim() + '.', 'ok');
    },

    'cambiar-pin'(form, d) {
      this.store.cambiarPin(d.actual, d.nuevo);
      form.reset();
      this.aviso('PIN cambiado.', 'ok');
    }
  };

  // ---------- Cambios en campos ----------
  App.prototype.cambios = {
    ajuste(el) {
      const valor = el.type === 'checkbox' ? el.checked : el.value;
      this.store.editarAjustes(this.perfilId, { [el.name]: valor });
      const foco = this.raiz.querySelector('[name="' + el.name + '"]' + (el.type === 'checkbox' ? '' : '[value="' + el.value + '"]'));
      if (foco) foco.focus();
    },

    foto(el) {
      const archivo = el.files && el.files[0];
      if (!archivo) return;
      return comprimirImagen(archivo, 1024, 0.6).then((url) => {
        this.fotoTemporal = url;
        const prev = this.raiz.querySelector('#foto-preview');
        if (prev) prev.innerHTML = '<img src="' + url + '" alt="Foto adjunta"><button type="button" class="enlace" data-accion="quitar-foto">Quitar foto</button>';
      });
    },

    plan(el) {
      const lista = this.raiz.querySelector('#plan-preview');
      if (lista) lista.innerHTML = AQ.vistas.planPreview(this, el.value);
    },

    importar(el) {
      const archivo = el.files && el.files[0];
      if (!archivo) return;
      return archivo.text().then(async (texto) => {
        el.value = '';
        if (this.store.perfiles.length && !await this.dialogo({ titulo: '¿Importar la copia?', mensaje: 'Reemplaza todos los datos actuales de este navegador.', confirmar: 'Importar', peligro: true })) return;
        this._importarTexto(texto);
      });
    }
  };

  AQ.App = App;

  // ---------- Arranque ----------
  if (typeof document !== 'undefined') {
    document.addEventListener('DOMContentLoaded', () => {
      const raiz = document.getElementById('app');
      const avisos = document.getElementById('avisos');
      const dialogo = document.getElementById('dialogo');
      let store;
      let sinGuardado = false;
      try {
        // Fase 2: cambiar esta línea por otro repositorio (por ejemplo, uno en la nube).
        const repo = new AQ.LocalStorageRepository('agendaquest.v1');
        try {
          repo.almacenamiento.setItem('agendaquest.prueba', '1');
          repo.almacenamiento.removeItem('agendaquest.prueba');
        } catch (e) {
          throw new AQ.ErrorAlmacenamiento('sin-acceso');
        }
        store = new AQ.Store(repo);
      } catch (e) {
        if (e.message === 'sin-acceso') {
          // El navegador no deja guardar (ventana privada, visor bloqueado): funciona igual, sin memoria.
          store = new AQ.Store(new AQ.MemoryRepository());
          sinGuardado = true;
        } else {
          raiz.innerHTML = '<main class="pantalla centrada"><h1 class="titulo-pixel">No se pudieron cargar los datos</h1><p class="texto-suave">' +
            AQ.util.esc(e.message) + '</p></main>';
          return;
        }
      }
      const app = new App(store, raiz, avisos, dialogo);
      AQ.app = app;
      app.iniciar();
      if (sinGuardado) app.aviso('Este navegador no deja guardar datos: lo que cargues se pierde al cerrar.', 'error');
    });
  }
})(globalThis.AQ = globalThis.AQ || {});

</script>
</body>
</html>
