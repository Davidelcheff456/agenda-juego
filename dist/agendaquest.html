<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12141C">
  <title>AgendaQuest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
  <style>
/* AgendaQuest — estilos. Oscuro, estilo gamer sobrio, pensado primero para celular. */

:root {
  --fondo: #12141C;
  --panel: #1C1F2B;
  --panel-2: #262A3A;
  --borde: #2A2E3F;
  --borde-fuerte: #4A5068;
  --texto: #F2EFE6;
  --suave: #A7ABBD;
  --tenue: #8A8FA3;
  --lima: #C6F25B;
  --lima-fondo: #232B1A;
  --dorado: #FFB547;
  --dorado-fondo: #2A2418;
  --coral: #FF7A6B;
  --verde: #7BE0A8;
  --azul: #6EC5FF;
  --azul-fondo: #1A2233;
  --radio: 14px;
  --pixel: 'Pixelify Sans', 'Courier New', monospace;
  --sans: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--fondo);
  color: var(--texto);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.4;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--azul); outline-offset: 2px; }
h1:focus { outline: none; }
img { max-width: 100%; }

.solo-lectores { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Estructura ---------- */
.pantalla {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  padding: 16px 16px 32px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.pantalla.con-nav { padding-bottom: 120px; }
.pantalla.centrada { justify-content: center; }
.pantalla.ancha { max-width: 1120px; }
.espaciador { flex-grow: 1; }

.barra { display: flex; align-items: center; gap: 10px; min-height: 48px; }
.barra h1 { margin: 0; flex-grow: 1; }
.barra-extra { display: flex; gap: 8px; align-items: center; margin-left: auto; }
.saludo { flex-grow: 1; display: flex; flex-direction: column; min-width: 0; }
.saludo h1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.titulo-pixel { font-family: var(--pixel); font-weight: 700; font-size: 22px; letter-spacing: .3px; }
.titulo-pixel.grande { font-size: 30px; }
.titulo-pixel.azul { color: var(--azul); font-size: 18px; margin: 0; }
.subtitulo { margin: 0; font-size: 20px; font-weight: 500; color: var(--suave); }
.titulo-seccion { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--suave); }
.titulo-chico { margin: 0 0 8px; font-size: 16px; font-weight: 700; }
.titulo-detalle { margin: 4px 0 8px; font-size: 22px; }
.texto-suave { color: var(--suave); margin: 0; }
.texto-chico { font-size: 13px; color: var(--suave); }
.texto-error { color: var(--coral); margin: 0; }
.centro { text-align: center; }
.ok { color: var(--verde); }
.mal { color: var(--coral); }
.alerta { color: var(--dorado); }
.azul { color: var(--azul); }
.dorado { color: var(--dorado); }
.titulo-seccion.mal { color: var(--coral); }
.titulo-seccion.alerta { color: var(--dorado); }
.titulo-seccion.ok { color: var(--verde); }
.titulo-seccion.azul { color: var(--azul); }

.logo { display: flex; align-items: center; gap: 10px; }
.logo.chico .titulo-pixel { font-size: 20px; }

.tarjeta { background: var(--panel); border-radius: 18px; padding: 16px; }
.seccion { display: flex; flex-direction: column; gap: 8px; }
.fila-entre { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.vacio { background: var(--panel); border: 2px dashed var(--borde); border-radius: 18px; padding: 20px; text-align: center; color: var(--suave); display: flex; flex-direction: column; align-items: center; gap: 12px; }
.vacio p { margin: 0; }

/* ---------- Botones ---------- */
.boton {
  min-height: 48px;
  padding: 0 18px;
  border-radius: var(--radio);
  border: 0;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  text-decoration: none;
  text-align: center;
}
.boton.chico { min-height: 44px; padding: 0 14px; font-size: 14px; }
.boton.ancho { width: 100%; }
.boton.primario { background: var(--lima); color: var(--fondo); }
.boton.primario:hover { background: #D6FF74; }
.boton.secundario { background: var(--panel-2); color: var(--texto); }
.boton.secundario:hover { background: #30354A; }
.boton.peligro { background: transparent; color: var(--coral); border: 1px solid #5A3434; }
.boton.apagado { background: var(--panel-2); color: var(--suave); cursor: not-allowed; }
.boton-icono {
  width: 44px; height: 44px; flex-shrink: 0;
  border-radius: 12px; border: 0;
  background: var(--panel); color: var(--texto);
  display: inline-flex; align-items: center; justify-content: center;
}
.boton-icono:hover { background: var(--panel-2); }
.enlace { background: none; border: 0; color: var(--lima); text-decoration: underline; padding: 8px 0; font-size: 14px; }
.boton-texto { background: none; border: 0; text-align: left; padding: 0; }
.fila-botones { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.acciones { display: flex; flex-direction: column; gap: 10px; }

.pastilla-monedas {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 44px; padding: 0 14px; border-radius: 22px; border: 0;
  background: var(--dorado-fondo); color: var(--dorado); font-weight: 700;
}
.monedas { display: inline-flex; align-items: center; gap: 6px; color: var(--dorado); font-weight: 700; }
.monedas-chico { display: inline-flex; align-items: center; gap: 4px; color: var(--dorado); font-weight: 700; font-size: 13px; }

.fab {
  position: fixed; right: max(16px, calc(50vw - 224px)); bottom: 92px;
  width: 64px; height: 64px; border-radius: 20px; border: 0;
  background: var(--lima); color: var(--fondo);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 18px rgba(0,0,0,.45);
  z-index: 5;
}

.nav-inferior {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
  max-width: 480px; margin: 0 auto;
  background: #171923; border-top: 1px solid var(--borde);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
}
.nav-item {
  min-height: 56px; border: 0; background: none; border-radius: 12px;
  color: var(--tenue); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 11px; font-weight: 500;
}
.nav-item.activo { color: var(--lima); background: var(--lima-fondo); }

/* ---------- Perfiles ---------- */
.grilla-perfiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.tarjeta-perfil {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 20px 10px 16px; border-radius: 20px;
  background: var(--panel); border: 2px solid var(--borde);
}
.tarjeta-perfil:hover { border-color: var(--lima); }
.nombre-perfil { font-family: var(--pixel); font-weight: 700; font-size: 20px; overflow-wrap: anywhere; text-align: center; }

/* ---------- Mascota ---------- */
.tarjeta-mascota {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 16px; border-radius: 20px;
}
.tarjeta-mascota.grande { flex-direction: column; text-align: center; padding: 20px 16px; }
.tarjeta-mascota.grande .mascota-info { width: 100%; }
.mascota-caja { position: relative; flex-shrink: 0; line-height: 0; }
.mascota-info { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex-grow: 1; }
.mascota-info .titulo-pixel { font-size: 18px; }
.estado-mascota { font-size: 12px; font-weight: 700; }
.mensaje-mascota { margin: 0; font-size: 14px; line-height: 1.35; }
.tarjeta-mascota.grande .fila-entre { justify-content: center; gap: 12px; }
.medidores { display: grid; grid-template-columns: 48px minmax(0, 1fr); align-items: center; gap: 4px 8px; font-size: 12px; color: var(--suave); text-align: left; }
.barra-progreso { height: 8px; border-radius: 3px; background: #33384C; overflow: hidden; }
.barra-progreso > div { height: 100%; border-radius: 3px; transition: width .4s; }

@keyframes salto {
  0% { transform: translateY(0); }
  25% { transform: translateY(-16px); }
  50% { transform: translateY(0); }
  70% { transform: translateY(-7px); }
  100% { transform: translateY(0); }
}
.salta .mascota-svg { animation: salto .7s ease-out 3; }
.chispas { position: absolute; inset: 0; pointer-events: none; }
.chispas i {
  position: absolute; left: 50%; top: 40%; width: 6px; height: 6px;
  background: var(--lima); animation: chispa .9s ease-out forwards;
}
.chispas i:nth-child(2n) { background: var(--dorado); }
.chispas i:nth-child(3n) { background: var(--azul); }
.chispas i:nth-child(1) { --dx: -48px; --dy: -40px; }
.chispas i:nth-child(2) { --dx: 44px; --dy: -46px; }
.chispas i:nth-child(3) { --dx: -56px; --dy: 4px; }
.chispas i:nth-child(4) { --dx: 54px; --dy: 0px; }
.chispas i:nth-child(5) { --dx: -20px; --dy: -60px; }
.chispas i:nth-child(6) { --dx: 22px; --dy: -58px; }
@keyframes chispa {
  from { transform: translate(0, 0); opacity: 1; }
  to { transform: translate(var(--dx), var(--dy)); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .salta .mascota-svg, .chispas i { animation: none; }
  .chispas { display: none; }
  .barra-progreso > div { transition: none; }
}

/* ---------- Tareas ---------- */
.fila-tarea {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 10px 6px 4px; border-radius: var(--radio);
  background: var(--panel); border: 1px solid var(--borde);
}
.fila-tarea.vencida { border-color: var(--coral); }
.fila-tarea.enviada .fila-titulo { color: var(--suave); text-decoration: line-through; }
.fila-tarea.hecha { opacity: .75; }
.fila-cuerpo {
  flex-grow: 1; min-width: 0; text-align: left;
  display: flex; flex-direction: column; gap: 3px;
  background: none; border: 0; padding: 8px 10px; border-radius: 10px;
}
button.fila-cuerpo:hover { background: rgba(255,255,255,.03); }
.meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--suave); }
.punto { display: inline-block; width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
.fila-titulo { font-size: 15px; font-weight: 500; overflow-wrap: anywhere; display: flex; align-items: center; gap: 6px; }
.aviso-ok { font-size: 12px; color: var(--lima); }
.aviso-nota { font-size: 13px; color: var(--dorado); }
.chip-mini { font-size: 11px; padding: 2px 7px; border-radius: 6px; background: var(--panel-2); color: var(--suave); }
.chip-mini.ok { color: var(--verde); }
.casillero {
  width: 44px; height: 44px; flex-shrink: 0; padding: 0;
  border-radius: 12px; border: 2px solid var(--borde-fuerte); background: transparent;
  display: flex; align-items: center; justify-content: center; color: var(--fondo);
}
.casillero:hover { border-color: var(--lima); }
.casillero.marcado { background: var(--lima); border-color: var(--lima); }

.tarjeta-examen {
  display: flex; flex-direction: column; gap: 6px; text-align: left;
  padding: 16px; border-radius: 16px; background: var(--azul-fondo); border: 1px solid #2C3D5C;
}
.etiqueta-azul { font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--azul); }
.segmentos { display: flex; gap: 6px; }
.segmentos i { flex-grow: 1; height: 8px; border-radius: 2px; background: #33384C; }
.segmentos i.lleno { background: var(--azul); }

.fila-examen {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  padding: 10px 12px; border-radius: var(--radio); border: 1px solid var(--borde); background: var(--panel);
  margin-bottom: 8px;
}
.fila-examen:hover { border-color: var(--azul); }
.fila-examen-texto { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fecha-bloque { width: 44px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
.fecha-bloque small { font-size: 11px; color: var(--suave); }
.fecha-bloque b { font-family: var(--pixel); font-size: 22px; }

.lista-plan { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.lista-plan li { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 12px; background: var(--fondo); font-size: 14px; }
.lista-plan li span:nth-child(2) { flex-grow: 1; }
.plan { background: var(--azul-fondo); border: 1px solid #2C3D5C; display: flex; flex-direction: column; gap: 10px; }
.plan .texto-chico { color: #B9C3D6; margin: 0; }

.detalle .datos { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 15px; }
.detalle dt { color: var(--suave); }
.detalle dd { margin: 0; overflow-wrap: anywhere; }
.foto-grande { display: block; margin-top: 14px; border-radius: 12px; max-height: 60vh; object-fit: contain; }

/* ---------- Formularios ---------- */
.formulario { display: flex; flex-direction: column; gap: 10px; }
.formulario label, .formulario legend { font-size: 14px; font-weight: 700; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend { padding: 0; margin-bottom: 10px; }
input[type=text], input[type=password], input[type=number], input[type=date], textarea {
  width: 100%; min-height: 50px; padding: 10px 14px;
  border-radius: var(--radio); border: 2px solid #33384C;
  background: var(--panel); color: var(--texto); font-size: 16px;
}
input[type=date] { color-scheme: dark; }
textarea { resize: vertical; }
input:focus, textarea:focus { border-color: var(--lima); outline: none; }
input::placeholder, textarea::placeholder { color: var(--tenue); }
.fila-form { display: flex; gap: 8px; }
.fila-form input { flex-grow: 1; }

.grilla-chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.fila-chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { min-height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--borde); background: var(--panel); font-size: 14px; }
.chip:hover { border-color: var(--lima); }
.chip-radio { position: relative; }
.chip-radio input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.chip-radio span {
  min-height: 46px; padding: 0 10px; border-radius: 12px; border: 2px solid var(--borde);
  background: var(--panel); font-size: 14px; font-weight: 500;
  display: flex; align-items: center; gap: 8px;
}
.chip-radio input:checked + span { border-color: var(--lima); background: var(--lima-fondo); }
.chip-radio input:focus-visible + span { outline: 3px solid var(--azul); outline-offset: 2px; }
.chip-radio input:disabled + span { opacity: .6; }

.fila-muestras { display: flex; flex-wrap: wrap; gap: 10px; }
.muestra { position: relative; }
.muestra input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.muestra > span { display: block; width: 44px; height: 44px; border-radius: 12px; border: 3px solid transparent; }
.muestra input:checked + span { border-color: var(--texto); }
.muestra input:focus-visible + span { outline: 3px solid var(--azul); outline-offset: 2px; }

.aviso-monedas { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: var(--radio); background: var(--dorado-fondo); color: #FFD08A; font-size: 14px; }
.foto-campo { display: flex; flex-direction: column; gap: 8px; }
.foto-campo label.boton { font-size: 15px; }
.foto-preview img { border-radius: 12px; max-height: 220px; display: block; }

/* ---------- Listas ---------- */
.lista-simple { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.lista-simple li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--radio); background: var(--fondo); }
.tarjeta .lista-simple li { background: var(--fondo); }
.pantalla > .lista-simple li { background: var(--panel); }
.lista-simple li.vencida { box-shadow: inset 0 0 0 1px var(--coral); }
.lista-texto { flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.lista-texto small { font-size: 12px; color: var(--suave); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.cuadro-color { width: 20px; height: 20px; border-radius: 6px; flex-shrink: 0; }
.fila-premio { background: var(--panel) !important; }

.lista-movs { list-style: none; margin: 0; padding: 0; }
.lista-movs li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--borde); font-size: 14px; }
.lista-movs li:last-child { border-bottom: 0; }
.lista-movs small { display: block; color: var(--tenue); font-size: 12px; }
.lista-reglas { margin: 0; padding-left: 20px; color: var(--suave); font-size: 14px; display: flex; flex-direction: column; gap: 4px; }

.grilla-cosmeticos { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-bottom: 12px; }
.cosmetico { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px; border-radius: var(--radio); background: var(--panel); text-align: center; }
.muestra-fondo { width: 48px; height: 48px; border-radius: 10px; display: block; border: 1px solid var(--borde); }

/* ---------- Panel del padre ---------- */
.padre-barra { flex-wrap: wrap; }
.pestanas { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.pestana {
  min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--borde);
  background: var(--panel); font-weight: 700; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
}
.pestana.activa { background: var(--lima-fondo); border-color: var(--lima); }
.burbuja { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--lima); color: var(--fondo); font-size: 12px; display: inline-flex; align-items: center; justify-content: center; }
.revision { display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.revision > div:first-child { flex: 1 1 320px; }
.revision p { margin: 0; }
.revision-accion { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.kpi { background: var(--panel); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.kpi-valor { font-family: var(--pixel); font-size: 30px; line-height: 1.1; }
.columnas { display: grid; grid-template-columns: 1fr; gap: 16px; }
.columna { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.item-aprobar { display: flex; flex-direction: column; gap: 8px; padding: 8px 10px 12px; border-radius: var(--radio); background: var(--fondo); margin-bottom: 8px; }
.item-aprobar .fila-cuerpo { padding: 6px 4px; }
.form-devolver { display: flex; flex-direction: column; gap: 8px; }
.form-devolver label { font-size: 13px; font-weight: 700; }
.fila-barra { display: grid; grid-template-columns: 100px minmax(0, 1fr) 44px 40px; align-items: center; gap: 10px; font-size: 14px; margin-bottom: 8px; }
.fila-barra span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fila-barra b { text-align: right; }
.fila-barra small { color: var(--tenue); }

@media (min-width: 760px) {
  .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .columnas { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
  .pantalla.ancha { padding: 24px 32px 40px; }
}

/* ---------- Vida y comida ---------- */
.vida { display: inline-flex; gap: 3px; align-items: center; }
.vida.chica { gap: 2px; }
.fila-comida { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 4px; }
.tarjeta-mascota.grande .fila-comida { justify-content: center; }
.boton-comida { min-height: 40px; }

/* ---------- Pomodoro ---------- */
select {
  width: 100%; min-height: 50px; padding: 10px 14px;
  border-radius: var(--radio); border: 2px solid #33384C;
  background: var(--panel); color: var(--texto); font-size: 16px;
}
select:focus { border-color: var(--lima); outline: none; }
.grilla-tiempos { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.grilla-tiempos.tres { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.chip-tiempo span { justify-content: center; min-height: 56px; font-size: 14px; }
.chip-tiempo b { font-family: var(--pixel); font-size: 22px; }

  <script>
/* js/util.js */
/*
 * util.js — Funciones auxiliares sin estado: fechas, ids, escape de HTML y hash del PIN.
 * Todas las fechas de la app se guardan como texto 'AAAA-MM-DD' en hora local,
 * así no hay problemas de zona horaria al comparar "hoy", "mañana" o "vencida".
 */
(function (AQ) {
  'use strict';

  const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
  const DIAS_CORTO = ['DOM', 'LUN', 'MAR', 'MIÉ', 'JUE', 'VIE', 'SÁB'];
  const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio',
    'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

  class Fecha {
    /** Fecha local de hoy como 'AAAA-MM-DD'. Se puede fijar para pruebas con Fecha.fijar(). */
    static hoy() {
      if (Fecha._fija) return Fecha._fija;
      return Fecha.aTexto(new Date());
    }

    static fijar(texto) { Fecha._fija = texto || null; }

    static aTexto(d) {
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const dia = String(d.getDate()).padStart(2, '0');
      return d.getFullYear() + '-' + m + '-' + dia;
    }

    static aDate(texto) {
      const [a, m, d] = texto.split('-').map(Number);
      return new Date(a, m - 1, d, 12, 0, 0);
    }

    static sumarDias(texto, n) {
      const d = Fecha.aDate(texto);
      d.setDate(d.getDate() + n);
      return Fecha.aTexto(d);
    }

    /** Días entre dos fechas (b - a). */
    static diferencia(a, b) {
      return Math.round((Fecha.aDate(b) - Fecha.aDate(a)) / 86400000);
    }

    /** Lunes de la semana de esa fecha. */
    static lunes(texto) {
      const d = Fecha.aDate(texto);
      const dow = (d.getDay() + 6) % 7; // 0 = lunes
      return Fecha.sumarDias(texto, -dow);
    }

    static esValida(texto) {
      return /^\d{4}-\d{2}-\d{2}$/.test(texto || '') && !isNaN(Fecha.aDate(texto));
    }

    static diaSemana(texto) { return DIAS[Fecha.aDate(texto).getDay()]; }
    static diaCorto(texto) { return DIAS_CORTO[Fecha.aDate(texto).getDay()]; }
    static numeroDia(texto) { return Fecha.aDate(texto).getDate(); }

    /** "lunes 28 de septiembre" */
    static larga(texto) {
      const d = Fecha.aDate(texto);
      return DIAS[d.getDay()] + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()];
    }

    /** Texto relativo corto: "hoy", "mañana", "ayer", "jueves 1", "hace 3 días". */
    static relativa(texto) {
      const n = Fecha.diferencia(Fecha.hoy(), texto);
      if (n === 0) return 'hoy';
      if (n === 1) return 'mañana';
      if (n === -1) return 'ayer';
      if (n > 1 && n < 7) return DIAS[Fecha.aDate(texto).getDay()] + ' ' + Fecha.numeroDia(texto);
      if (n < -1) return 'hace ' + (-n) + ' días';
      const d = Fecha.aDate(texto);
      return d.getDate() + ' de ' + MESES[d.getMonth()];
    }

    static nombreMes(texto) { return MESES[Fecha.aDate(texto).getMonth()]; }
  }

  function nuevoId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  /** Escapa texto del usuario antes de meterlo en HTML. Nunca se inserta texto sin pasar por acá. */
  function esc(valor) {
    return String(valor == null ? '' : valor)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  /**
   * Hash simple (FNV-1a) para no guardar el PIN a la vista.
   * Ojo: es un candado para chicos, no seguridad real; quien sepa abrir las
   * herramientas del navegador puede cambiar los datos igual.
   */
  function hashPin(pin) {
    let h = 0x811c9dc5;
    const texto = 'agendaquest:' + pin;
    for (let i = 0; i < texto.length; i++) {
      h ^= texto.charCodeAt(i);
      h = Math.imul(h, 0x01000193) >>> 0;
    }
    return h.toString(16);
  }

  function limitar(n, min, max) { return Math.max(min, Math.min(max, n)); }

  AQ.Fecha = Fecha;
  AQ.util = { nuevoId, esc, hashPin, limitar };
})(globalThis.AQ = globalThis.AQ || {});

</script>
  <script>
/* js/repository.js */
/*
 * repository.js — Capa de acceso a datos (patrón Repository).
 *
 * El resto de la app solo conoce la "interfaz": cargar() y guardar(estado).
 * Fase 1 usa LocalStorageRepository (datos en este navegador).
 * En la fase 2 se escribe, por ejemplo, un SupabaseRepository con los mismos
 * dos métodos y se cambia una sola línea en app.js, sin tocar pantallas ni reglas.
 */
(function (AQ) {
  'use strict';

  const VERSION_DATOS = 1;

  function estadoVacio() {
    return {
      version: VERSION_DATOS,
      pinHash: null,
      perfiles: [],
      materias: [],
      tareas: [],
      examenes: [],
      movimientos: [],
      pomodoros: [],
      premios: [],
      canjes: []
    };
  }

  /** "Interfaz" base: documenta el contrato que cumple cualquier repositorio. */
  class Repositorio {
    /** @returns {object} el estado completo de la app */
    cargar() { throw new Error('cargar() no implementado'); }
    /** @param {object} estado */
    guardar(estado) { throw new Error('guardar() no implementado'); }
  }

  class LocalStorageRepository extends Repositorio {
    constructor(clave, almacenamiento) {
      super();
      this.clave = clave || 'agendaquest.v1';
      this.almacenamiento = almacenamiento || globalThis.localStorage;
    }

    cargar() {
      let texto = null;
      try {
        texto = this.almacenamiento.getItem(this.clave);
      } catch (e) {
        throw new ErrorAlmacenamiento('El navegador no deja guardar datos (¿ventana privada?).');
      }
      if (!texto) return estadoVacio();
      try {
        return Repositorio.normalizar(JSON.parse(texto));
      } catch (e) {
        throw new ErrorAlmacenamiento('Los datos guardados están dañados. Podés importar una copia de seguridad.');
      }
    }

    guardar(estado) {
      try {
        this.almacenamiento.setItem(this.clave, JSON.stringify(estado));
      } catch (e) {
        throw new ErrorAlmacenamiento('No hay más espacio para guardar. Borrá fotos viejas desde el panel del padre.');
      }
    }
  }

  /** Repositorio en memoria: útil para pruebas. */
  class MemoryRepository extends Repositorio {
    constructor(inicial) { super(); this.estado = inicial || estadoVacio(); }
    cargar() { return JSON.parse(JSON.stringify(this.estado)); }
    guardar(estado) { this.estado = JSON.parse(JSON.stringify(estado)); }
  }

  class ErrorAlmacenamiento extends Error {}

  /** Completa campos faltantes para que datos viejos o importados no rompan la app. */
  Repositorio.normalizar = function (datos) {
    if (!datos || typeof datos !== 'object') throw new Error('Formato inválido');
    const base = estadoVacio();
    for (const clave of Object.keys(base)) {
      if (Array.isArray(base[clave]) && !Array.isArray(datos[clave])) datos[clave] = [];
    }
    if (!('pinHash' in datos)) datos.pinHash = null;
    datos.version = VERSION_DATOS;
    for (const p of datos.perfiles) {
      p.mascota = Object.assign({ nombre: 'Brote', color: 'lima', fondo: 'ninguno', colores: ['lima'], fondos: ['ninguno'] }, p.mascota || {});
      p.bonosSemana = Array.isArray(p.bonosSemana) ? p.bonosSemana : [];
      p.revision = Object.assign({ ultima: null, racha: 0 }, p.revision || {});
      p.vida = Object.assign({ valor: 5, revisadoHasta: null, comioEl: null, vacaciones: false }, p.vida || {});
    }
    return datos;
  };

  AQ.estadoVacio = estadoVacio;
  AQ.Repositorio = Repositorio;
  AQ.LocalStorageRepository = LocalStorageRepository;
  AQ.MemoryRepository = MemoryRepository;
  AQ.ErrorAlmacenamiento = ErrorAlmacenamiento;
})(globalThis.AQ = globalThis.AQ || {});

</script>
  <script>
/* js/rules.js */
/*
 * rules.js — Reglas del juego, separadas de los datos y de las pantallas.
 * Si querés ajustar cuántas monedas da cada cosa, se cambia acá y nada más.
 */
(function (AQ) {
  'use strict';

  const { Fecha, util } = AQ;

  const MONEDAS = Object.freeze({
    ANOTAR: 5,            // el estudiante anota una tarea
    A_TIEMPO: 15,         // aprobada, marcada como hecha antes o el día del vencimiento
    TARDE: 5,             // aprobada, pero terminada después del vencimiento
    SESION: 10,           // sesión de estudio de examen aprobada
    RACHA_REVISION: 20,   // 5 días seguidos de revisión diaria con el padre
    SEMANA_LIMPIA: 30,    // una semana sin tareas vencidas
    POMODORO_POR_5_MIN: 1, // pomodoro completo: 1 moneda cada 5 minutos de foco (15 min = 3, 30 min = 6)
    TOPE_POMODORO_DIA: 30  // máximo de monedas por pomodoros en un día (evita dejar el reloj corriendo solo)
  });

  const XP_POR_NIVEL = 100;

  /** Vida de la mascota: 5 segmentos. Come una vez por día; cada día sin comer pierde 1. */
  const VIDA = Object.freeze({
    MAX: 5,
    COSTO_COMIDA: 5,  // monedas por comida
    DEBIL: 2          // con 2 segmentos o menos está débil
  });

  const COLORES_MATERIA = ['#6EC5FF', '#FF9ECF', '#F7A35C', '#7BE0A8', '#B79CFF', '#E8E07A', '#FF7A6B', '#5EE0D8', '#C6F25B', '#D9A6FF'];

  /** Cosméticos de la mascota: colores del cuerpo y fondos de la tarjeta. */
  const COSMETICOS = Object.freeze({
    colores: [
      { id: 'lima', nombre: 'Lima', precio: 0, cuerpo: '#C6F25B', triste: '#A3B56B' },
      { id: 'celeste', nombre: 'Celeste', precio: 80, cuerpo: '#7FD4FF', triste: '#7FA3B8' },
      { id: 'rosa', nombre: 'Rosa chicle', precio: 80, cuerpo: '#FF9ECF', triste: '#B88AA2' },
      { id: 'lava', nombre: 'Lava', precio: 150, cuerpo: '#FF8A5B', triste: '#B87F66' },
      { id: 'oro', nombre: 'Dorado', precio: 300, cuerpo: '#FFD35C', triste: '#B8A366' }
    ],
    fondos: [
      { id: 'ninguno', nombre: 'Liso', precio: 0, css: '#1C1F2B' },
      { id: 'noche', nombre: 'Noche estrellada', precio: 120, css: 'radial-gradient(circle at 80% 20%, #3B4A7A 0 6%, transparent 7%), #1A2233' },
      { id: 'pasto', nombre: 'Pasto', precio: 120, css: 'linear-gradient(#1C2B22 70%, #2F5A34 70%)' },
      { id: 'atardecer', nombre: 'Atardecer', precio: 200, css: 'linear-gradient(#3A2340, #6B3A3A 70%, #2A1E2A 70%)' }
    ]
  });

  function color(id) { return COSMETICOS.colores.find((c) => c.id === id) || COSMETICOS.colores[0]; }
  function fondo(id) { return COSMETICOS.fondos.find((f) => f.id === id) || COSMETICOS.fondos[0]; }

  function nivelDesdeXp(xp) { return 1 + Math.floor(xp / XP_POR_NIVEL); }

  /** Etapa de la mascota: huevo hasta anotar la primera tarea; después según el nivel. */
  function etapa(nivel, tieneTareas) {
    if (!tieneTareas) return 'huevo';
    if (nivel <= 3) return 'bebe';
    if (nivel <= 7) return 'joven';
    return 'adulto';
  }

  const NOMBRE_ETAPA = { huevo: 'Huevo', bebe: 'Bebé', joven: 'Joven', adulto: 'Adulta' };
  const PROXIMA_ETAPA = { bebe: { nivel: 4, nombre: 'joven' }, joven: { nivel: 8, nombre: 'adulta' } };

  /**
   * Plan de estudio para un examen (patrón Strategy: se puede reemplazar por otro plan).
   * Reparte hasta 4 sesiones en los 5 días previos al examen, sin usar días pasados.
   * Basado en la evidencia de práctica distribuida y autoevaluación (Dunlosky y otros, 2013).
   */
  class PlanEspaciado {
    constructor() {
      this.tipos = [
        'Repasar la teoría y hacer un resumen',
        'Ejercicios de práctica',
        'Autoevaluación: responder preguntas sin mirar',
        'Repasar solo lo que salió mal'
      ];
    }

    generar(fechaExamen, hoy) {
      const disponibles = [];
      for (let i = 5; i >= 1; i--) {
        const dia = Fecha.sumarDias(fechaExamen, -i);
        if (Fecha.diferencia(hoy, dia) >= 0) disponibles.push(dia);
      }
      const d = disponibles.length;
      const n = Math.min(4, d);
      if (n === 0) return [];
      let indices;
      if (d === 5) indices = [0, 1, 3, 4];
      else if (n === 1) indices = [d - 1];
      else indices = Array.from({ length: n }, (_, i) => Math.round(i * (d - 1) / (n - 1)));
      const tiposPorCantidad = {
        1: [this.tipos[2]],
        2: [this.tipos[0], this.tipos[2]],
        3: [this.tipos[0], this.tipos[1], this.tipos[2]],
        4: this.tipos
      };
      return indices.map((idx, i) => ({ fecha: disponibles[idx], titulo: tiposPorCantidad[n][i] }));
    }
  }

  /**
   * Estado de la mascota, por prioridad:
   * débil (poca vida) > triste (tareas vencidas) > con hambre (no comió hoy) > preocupada (algo para hoy o mañana) > tranquila.
   * Nunca se muere: con la vida en 0 queda desmayada y se recupera comiendo.
   */
  function estadoMascota(resumen) {
    let estado = 'tranquilo';
    if (resumen.vida <= VIDA.DEBIL) estado = 'debil';
    else if (resumen.vencidas > 0) estado = 'triste';
    else if (!resumen.comioHoy && !resumen.vacaciones) estado = 'hambriento';
    else if (resumen.urgentes > 0) estado = 'preocupado';
    const animo = util.limitar(45 + 10 * resumen.sesionesSemana + 3 * (resumen.pomodorosSemana || 0) + 4 * resumen.rachaRevision - 20 * resumen.vencidas, 8, 100);
    return { estado, animo };
  }

  const TEXTO_ESTADO = {
    feliz: { nombre: '¡Ñam!', color: '#C6F25B' },
    tranquilo: { nombre: 'Panza llena', color: '#7BE0A8' },
    preocupado: { nombre: 'Preocupada', color: '#FFB547' },
    hambriento: { nombre: 'Con hambre', color: '#FFB547' },
    triste: { nombre: 'Triste', color: '#FF7A6B' },
    debil: { nombre: 'Débil', color: '#FF7A6B' }
  };

  function mensajeMascota(estado, resumen, nombreMascota) {
    switch (estado) {
      case 'feliz': return '¡Bien ahí! Cuando tu papá la apruebe, sumás monedas.';
      case 'debil':
        if (resumen.vida === 0) return 'Me quedé sin fuerzas. Cada comida me devuelve 1 de vida.';
        return resumen.saldo >= VIDA.COSTO_COMIDA
          ? 'Estoy débil. Necesito comer todos los días para recuperarme.'
          : 'Estoy débil y no hay monedas para comida. Terminá una tarea y dame de comer.';
      case 'triste':
        return resumen.vencidas === 1
          ? 'Hay una tarea vencida. Si la terminás, me pongo contento.'
          : 'Hay ' + resumen.vencidas + ' tareas vencidas. Si las terminás, me pongo contento.';
      case 'hambriento':
        return resumen.saldo >= VIDA.COSTO_COMIDA
          ? 'Tengo hambre. ¿Me das de comer? Si hoy no como, pierdo 1 de vida.'
          : 'Tengo hambre y no alcanzan las monedas. Terminá una tarea para conseguir comida.';
      case 'preocupado':
        return resumen.urgentes === 1
          ? 'Hay 1 cosa para hoy o mañana. ¿La hacemos?'
          : 'Hay ' + resumen.urgentes + ' cosas para hoy o mañana. ¿Arrancamos por una?';
      default:
        return resumen.pendientes === 0 ? 'Panza llena y todo al día. ¡Crack!' : 'Panza llena. Todo bajo control.';
    }
  }

  AQ.reglas = {
    MONEDAS, XP_POR_NIVEL, VIDA, COLORES_MATERIA, COSMETICOS, NOMBRE_ETAPA, PROXIMA_ETAPA, TEXTO_ESTADO,
    color, fondo, nivelDesdeXp, etapa, estadoMascota, mensajeMascota
  };
  AQ.PlanEspaciado = PlanEspaciado;
})(globalThis.AQ = globalThis.AQ || {});

</script>
  <script>
/* js/store.js */
/*
 * store.js — El "modelo" de la app: todas las operaciones sobre los datos.
 *
 * - Las pantallas nunca modifican el estado directamente: llaman a métodos del Store.
 * - Cada operación pasa por _confirmar(), que guarda con el repositorio y avisa
 *   a los suscriptores (patrón Observer) para que la pantalla se vuelva a dibujar.
 * - Si guardar falla (por ejemplo, sin espacio), el cambio se deshace.
 */
(function (AQ) {
  'use strict';

  const { Fecha, util, reglas } = AQ;
  const M = reglas.MONEDAS;

  class ErrorValidacion extends Error {}

  function exigir(condicion, mensaje) {
    if (!condicion) throw new ErrorValidacion(mensaje);
  }

  function textoLimpio(valor, max) {
    return String(valor == null ? '' : valor).trim().slice(0, max || 200);
  }

  class Store {
    constructor(repositorio, plan) {
      this.repo = repositorio;
      this.plan = plan || new AQ.PlanEspaciado();
      this.estado = repositorio.cargar();
      this.suscriptores = [];
    }

    // ---------- Observer ----------
    suscribir(fn) { this.suscriptores.push(fn); }
    _avisar(evento) { this.suscriptores.forEach((fn) => fn(evento)); }

    _confirmar(evento, mutacion) {
      const copia = JSON.stringify(this.estado);
      let resultado;
      try {
        resultado = mutacion();
        this.repo.guardar(this.estado);
      } catch (e) {
        this.estado = JSON.parse(copia);
        throw e;
      }
      this._avisar(evento);
      return resultado;
    }

    _movimiento(perfilId, cantidad, motivo, ref, tipo) {
      this.estado.movimientos.push({
        id: util.nuevoId(), perfilId, cantidad, motivo, ref: ref || null, tipo: tipo || 'otro', fecha: Fecha.hoy()
      });
    }

    // ---------- PIN del padre ----------
    tienePin() { return !!this.estado.pinHash; }

    configurarPin(pin) {
      exigir(/^\d{4}$/.test(pin), 'El PIN tiene que ser de 4 números.');
      return this._confirmar('pin', () => { this.estado.pinHash = util.hashPin(pin); });
    }

    verificarPin(pin) { return !!this.estado.pinHash && util.hashPin(pin) === this.estado.pinHash; }

    cambiarPin(actual, nuevo) {
      exigir(this.verificarPin(actual), 'El PIN actual no es correcto.');
      return this.configurarPin(nuevo);
    }

    // ---------- Perfiles ----------
    get perfiles() { return this.estado.perfiles; }
    perfil(id) { return this.estado.perfiles.find((p) => p.id === id) || null; }

    agregarPerfil(datos) {
      const nombre = textoLimpio(datos.nombre, 40);
      exigir(nombre, 'Poné el nombre del estudiante.');
      return this._confirmar('perfiles', () => {
        const p = {
          id: util.nuevoId(),
          nombre,
          anio: textoLimpio(datos.anio, 20),
          creado: Fecha.hoy(),
          mascota: { nombre: textoLimpio(datos.mascota, 20) || 'Brote', color: 'lima', fondo: 'ninguno', colores: ['lima'], fondos: ['ninguno'] },
          bonosSemana: [],
          revision: { ultima: null, racha: 0 },
          vida: { valor: reglas.VIDA.MAX, revisadoHasta: Fecha.sumarDias(Fecha.hoy(), -1), comioEl: null, vacaciones: false }
        };
        this.estado.perfiles.push(p);
        return p;
      });
    }

    editarPerfil(id, datos) {
      const p = this.perfil(id);
      exigir(p, 'Perfil no encontrado.');
      const nombre = textoLimpio(datos.nombre, 40);
      exigir(nombre, 'Poné el nombre del estudiante.');
      return this._confirmar('perfiles', () => {
        p.nombre = nombre;
        p.anio = textoLimpio(datos.anio, 20);
        if (datos.mascota != null) p.mascota.nombre = textoLimpio(datos.mascota, 20) || p.mascota.nombre;
      });
    }

    eliminarPerfil(id) {
      return this._confirmar('perfiles', () => {
        const e = this.estado;
        e.perfiles = e.perfiles.filter((p) => p.id !== id);
        ['materias', 'tareas', 'examenes', 'movimientos', 'canjes', 'pomodoros'].forEach((k) => {
          e[k] = e[k].filter((x) => x.perfilId !== id);
        });
      });
    }

    // ---------- Materias ----------
    materiasDe(perfilId) {
      return this.estado.materias.filter((m) => m.perfilId === perfilId)
        .sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
    }
    materia(id) { return this.estado.materias.find((m) => m.id === id) || null; }

    agregarMateria(perfilId, datos) {
      const nombre = textoLimpio(datos.nombre, 30);
      exigir(nombre, 'Poné el nombre de la materia.');
      exigir(!this.materiasDe(perfilId).some((m) => m.nombre.toLowerCase() === nombre.toLowerCase()), 'Ya tenés una materia con ese nombre.');
      return this._confirmar('materias', () => {
        const usadas = this.materiasDe(perfilId).length;
        const m = {
          id: util.nuevoId(), perfilId, nombre,
          color: datos.color || reglas.COLORES_MATERIA[usadas % reglas.COLORES_MATERIA.length],
          profesor: textoLimpio(datos.profesor, 40)
        };
        this.estado.materias.push(m);
        return m;
      });
    }

    editarMateria(id, datos) {
      const m = this.materia(id);
      exigir(m, 'Materia no encontrada.');
      const nombre = textoLimpio(datos.nombre, 30);
      exigir(nombre, 'Poné el nombre de la materia.');
      return this._confirmar('materias', () => {
        m.nombre = nombre;
        m.color = datos.color || m.color;
        m.profesor = textoLimpio(datos.profesor, 40);
      });
    }

    eliminarMateria(id) {
      const usada = this.estado.tareas.some((t) => t.materiaId === id && t.estado !== 'aprobada')
        || this.estado.examenes.some((x) => x.materiaId === id && Fecha.diferencia(Fecha.hoy(), x.fecha) >= 0);
      exigir(!usada, 'Esta materia tiene tareas o exámenes pendientes. Terminalos o borralos primero.');
      return this._confirmar('materias', () => {
        this.estado.materias = this.estado.materias.filter((m) => m.id !== id);
      });
    }

    // ---------- Tareas ----------
    tarea(id) { return this.estado.tareas.find((t) => t.id === id) || null; }
    tareasDe(perfilId) { return this.estado.tareas.filter((t) => t.perfilId === perfilId); }

    agregarTarea(perfilId, datos, porPadre) {
      const titulo = textoLimpio(datos.titulo, 120);
      exigir(this.perfil(perfilId), 'Perfil no encontrado.');
      exigir(this.materia(datos.materiaId), 'Elegí una materia.');
      exigir(titulo, 'Escribí qué hay que hacer.');
      exigir(Fecha.esValida(datos.vence), 'Elegí la fecha de entrega.');
      return this._confirmar('tareas', () => {
        const t = {
          id: util.nuevoId(), perfilId, tipo: 'tarea',
          materiaId: datos.materiaId, titulo,
          detalle: textoLimpio(datos.detalle, 500),
          vence: datos.vence, creada: Fecha.hoy(),
          creadaPor: porPadre ? 'padre' : 'estudiante',
          estado: 'pendiente', enviadaEl: null, aprobadaEl: null, nota: '',
          foto: datos.foto || null, examenId: null
        };
        const nace = this.tareasDe(perfilId).length === 0;
        this.estado.tareas.push(t);
        if (nace) {
          // La mascota nace con vida completa; el hambre empieza a contar desde mañana.
          const p = this.perfil(perfilId);
          p.vida.valor = reglas.VIDA.MAX;
          p.vida.revisadoHasta = Fecha.hoy();
        }
        if (!porPadre) this._movimiento(perfilId, M.ANOTAR, 'Anotaste: ' + titulo, t.id, 'anotar');
        return t;
      });
    }

    editarTarea(id, datos) {
      const t = this.tarea(id);
      exigir(t, 'Tarea no encontrada.');
      exigir(t.estado !== 'aprobada', 'Una tarea aprobada ya no se puede cambiar.');
      if (datos.vence != null) exigir(Fecha.esValida(datos.vence), 'Fecha inválida.');
      if (datos.titulo != null) exigir(textoLimpio(datos.titulo), 'Escribí qué hay que hacer.');
      return this._confirmar('tareas', () => {
        if (datos.titulo != null) t.titulo = textoLimpio(datos.titulo, 120);
        if (datos.detalle != null) t.detalle = textoLimpio(datos.detalle, 500);
        if (datos.vence != null) t.vence = datos.vence;
        if (datos.materiaId && this.materia(datos.materiaId) && t.tipo === 'tarea') t.materiaId = datos.materiaId;
        if ('foto' in datos) t.foto = datos.foto;
      });
    }

    marcarHecha(id) {
      const t = this.tarea(id);
      exigir(t && t.estado === 'pendiente', 'Esta tarea no está pendiente.');
      return this._confirmar('tareas', () => {
        t.estado = 'enviada';
        t.enviadaEl = Fecha.hoy();
        t.nota = '';
      });
    }

    desmarcar(id) {
      const t = this.tarea(id);
      exigir(t && t.estado === 'enviada', 'Esta tarea no está esperando aprobación.');
      return this._confirmar('tareas', () => {
        t.estado = 'pendiente';
        t.enviadaEl = null;
      });
    }

    /** El padre aprueba: recién ahí se acreditan las monedas. */
    aprobar(id) {
      const t = this.tarea(id);
      exigir(t && t.estado === 'enviada', 'Esta tarea no está esperando aprobación.');
      return this._confirmar('tareas', () => {
        let cantidad, motivo;
        if (t.tipo === 'sesion') {
          cantidad = M.SESION; motivo = 'Sesión de estudio: ' + t.titulo;
        } else if (Fecha.diferencia(t.enviadaEl, t.vence) >= 0) {
          cantidad = M.A_TIEMPO; motivo = 'A tiempo: ' + t.titulo;
        } else {
          cantidad = M.TARDE; motivo = 'Terminada tarde: ' + t.titulo;
        }
        t.estado = 'aprobada';
        t.aprobadaEl = Fecha.hoy();
        this._movimiento(t.perfilId, cantidad, motivo, t.id, 'aprobacion');
        return cantidad;
      });
    }

    devolver(id, nota) {
      const t = this.tarea(id);
      exigir(t && t.estado === 'enviada', 'Esta tarea no está esperando aprobación.');
      return this._confirmar('tareas', () => {
        t.estado = 'pendiente';
        t.enviadaEl = null;
        t.nota = textoLimpio(nota, 200) || 'Revisala de nuevo.';
      });
    }

    /** Borrar una tarea no aprobada. Si daba monedas por anotarla, se descuentan. */
    eliminarTarea(id) {
      const t = this.tarea(id);
      exigir(t, 'Tarea no encontrada.');
      exigir(t.estado !== 'aprobada', 'Una tarea aprobada no se puede borrar.');
      return this._confirmar('tareas', () => {
        const premio = this.estado.movimientos.find((m) => m.ref === t.id && m.tipo === 'anotar');
        if (premio) this._movimiento(t.perfilId, -premio.cantidad, 'Tarea borrada: ' + t.titulo, t.id, 'ajuste');
        this.estado.tareas = this.estado.tareas.filter((x) => x.id !== id);
      });
    }

    borrarFotosAprobadas() {
      return this._confirmar('tareas', () => {
        let n = 0;
        this.estado.tareas.forEach((t) => { if (t.foto && t.estado === 'aprobada') { t.foto = null; n++; } });
        return n;
      });
    }

    // ---------- Exámenes ----------
    examen(id) { return this.estado.examenes.find((x) => x.id === id) || null; }
    examenesDe(perfilId) {
      return this.estado.examenes.filter((x) => x.perfilId === perfilId).sort((a, b) => a.fecha.localeCompare(b.fecha));
    }
    sesionesDe(examenId) {
      return this.estado.tareas.filter((t) => t.examenId === examenId).sort((a, b) => a.vence.localeCompare(b.vence));
    }

    previsualizarPlan(fecha) {
      if (!Fecha.esValida(fecha)) return [];
      return this.plan.generar(fecha, Fecha.hoy());
    }

    agregarExamen(perfilId, datos) {
      exigir(this.materia(datos.materiaId), 'Elegí una materia.');
      exigir(Fecha.esValida(datos.fecha), 'Elegí la fecha del examen.');
      exigir(Fecha.diferencia(Fecha.hoy(), datos.fecha) >= 0, 'La fecha del examen ya pasó.');
      return this._confirmar('examenes', () => {
        const x = {
          id: util.nuevoId(), perfilId, materiaId: datos.materiaId, fecha: datos.fecha,
          temas: textoLimpio(datos.temas, 200), nota: ''
        };
        this.estado.examenes.push(x);
        this.plan.generar(x.fecha, Fecha.hoy()).forEach((s) => {
          this.estado.tareas.push({
            id: util.nuevoId(), perfilId, tipo: 'sesion', materiaId: x.materiaId,
            titulo: s.titulo, detalle: x.temas, vence: s.fecha, creada: Fecha.hoy(), creadaPor: 'app',
            estado: 'pendiente', enviadaEl: null, aprobadaEl: null, nota: '', foto: null, examenId: x.id
          });
        });
        return x;
      });
    }

    editarExamen(id, datos) {
      const x = this.examen(id);
      exigir(x, 'Examen no encontrado.');
      return this._confirmar('examenes', () => {
        if (datos.temas != null) x.temas = textoLimpio(datos.temas, 200);
        if (datos.nota != null) x.nota = textoLimpio(datos.nota, 10);
      });
    }

    /** Borra el examen y las sesiones que todavía no se aprobaron. */
    eliminarExamen(id) {
      return this._confirmar('examenes', () => {
        this.estado.examenes = this.estado.examenes.filter((x) => x.id !== id);
        this.estado.tareas = this.estado.tareas.filter((t) => !(t.examenId === id && t.estado !== 'aprobada'));
      });
    }

    // ---------- Monedas ----------
    movimientosDe(perfilId) {
      return this.estado.movimientos.filter((m) => m.perfilId === perfilId);
    }
    saldo(perfilId) { return this.movimientosDe(perfilId).reduce((s, m) => s + m.cantidad, 0); }
    /** Experiencia: monedas ganadas (sin contar gastos, reintegros ni descuentos por tareas borradas). */
    xp(perfilId) {
      const movs = this.movimientosDe(perfilId);
      const ganadas = movs.filter((m) => m.cantidad > 0 && m.tipo !== 'reintegro').reduce((s, m) => s + m.cantidad, 0);
      const descontadas = movs.filter((m) => m.tipo === 'ajuste').reduce((s, m) => s - m.cantidad, 0);
      return ganadas - descontadas;
    }
    nivel(perfilId) { return reglas.nivelDesdeXp(Math.max(0, this.xp(perfilId))); }

    // ---------- Vida y comida de la mascota ----------
    /**
     * Revisa los días que pasaron desde la última vez: cada día sin comer resta 1 de vida.
     * No cuenta mientras la mascota es un huevo ni con el modo vacaciones activo.
     * Solo guarda si algo cambió. Devuelve cuántos puntos de vida perdió.
     */
    actualizarVida(perfilId) {
      const p = this.perfil(perfilId);
      if (!p) return 0;
      const v = p.vida;
      const ayer = Fecha.sumarDias(Fecha.hoy(), -1);
      if (!v.revisadoHasta) v.revisadoHasta = ayer;
      if (v.revisadoHasta >= ayer) return 0;
      const nacida = this.tareasDe(perfilId).length > 0;
      return this._confirmar('vida', () => {
        let perdidas = 0;
        if (nacida && !v.vacaciones) {
          let dia = Fecha.sumarDias(v.revisadoHasta, 1);
          while (dia <= ayer) {
            if (v.comioEl !== dia && v.valor > 0) { v.valor -= 1; perdidas += 1; }
            dia = Fecha.sumarDias(dia, 1);
          }
        }
        v.revisadoHasta = ayer;
        return perdidas;
      });
    }

    comioHoy(perfilId) {
      const p = this.perfil(perfilId);
      return !!p && p.vida.comioEl === Fecha.hoy();
    }

    /** Darle de comer: cuesta monedas, una vez por día, y devuelve 1 de vida. */
    alimentar(perfilId) {
      const p = this.perfil(perfilId);
      exigir(p, 'Perfil no encontrado.');
      exigir(this.tareasDe(perfilId).length > 0, 'Todavía es un huevo: anotá tu primera tarea para que nazca.');
      exigir(!this.comioHoy(perfilId), 'Ya comió hoy. Mañana tiene hambre de nuevo.');
      const costo = reglas.VIDA.COSTO_COMIDA;
      exigir(this.saldo(perfilId) >= costo, 'Te faltan monedas para la comida. Terminá una tarea y volvé.');
      return this._confirmar('vida', () => {
        p.vida.comioEl = Fecha.hoy();
        const antes = p.vida.valor;
        p.vida.valor = Math.min(reglas.VIDA.MAX, p.vida.valor + 1);
        this._movimiento(perfilId, -costo, 'Comida para ' + p.mascota.nombre, null, 'comida');
        return p.vida.valor - antes;
      });
    }

    /** Modo vacaciones: la mascota no pierde vida mientras está activo (lo maneja el padre). */
    ponerVacaciones(perfilId, activo) {
      const p = this.perfil(perfilId);
      exigir(p, 'Perfil no encontrado.');
      return this._confirmar('vida', () => {
        p.vida.vacaciones = !!activo;
        // Hoy no se cuenta: el cambio rige desde mañana.
        p.vida.revisadoHasta = Fecha.hoy();
      });
    }

    // ---------- Pomodoro ----------
    /**
     * Registra un pomodoro completo. Da 1 moneda cada 5 minutos de foco,
     * con un tope diario para que no convenga dejar el reloj corriendo solo.
     * Devuelve las monedas acreditadas (puede ser 0 si ya llegó al tope).
     */
    registrarPomodoro(perfilId, minutos, tareaId) {
      exigir(this.perfil(perfilId), 'Perfil no encontrado.');
      exigir(minutos > 0 && minutos <= 60, 'Duración inválida.');
      const hoy = Fecha.hoy();
      const yaHoy = this.estado.movimientos.filter((m) => m.perfilId === perfilId && m.tipo === 'pomodoro' && m.fecha === hoy)
        .reduce((s, m) => s + m.cantidad, 0);
      const base = Math.floor(minutos / 5) * M.POMODORO_POR_5_MIN;
      const cantidad = Math.max(0, Math.min(base, M.TOPE_POMODORO_DIA - yaHoy));
      return this._confirmar('pomodoro', () => {
        const t = tareaId ? this.tarea(tareaId) : null;
        this.estado.pomodoros.push({ id: util.nuevoId(), perfilId, fecha: hoy, minutos, tareaId: t ? t.id : null });
        if (cantidad > 0) this._movimiento(perfilId, cantidad, 'Pomodoro de ' + minutos + ' min' + (t ? ': ' + t.titulo : ''), null, 'pomodoro');
        return cantidad;
      });
    }

    /** Pomodoros completos y minutos de foco en los últimos `dias` días (incluye hoy). */
    estudio(perfilId, dias) {
      const desde = Fecha.sumarDias(Fecha.hoy(), -(dias - 1));
      const lista = this.estado.pomodoros.filter((p) => p.perfilId === perfilId && p.fecha >= desde);
      return { pomodoros: lista.length, minutos: lista.reduce((s, p) => s + p.minutos, 0) };
    }

    monedasPomodoroHoy(perfilId) {
      const hoy = Fecha.hoy();
      return this.estado.movimientos.filter((m) => m.perfilId === perfilId && m.tipo === 'pomodoro' && m.fecha === hoy)
        .reduce((s, m) => s + m.cantidad, 0);
    }

    // ---------- Premios y canjes ----------
    get premios() { return this.estado.premios; }

    agregarPremio(datos) {
      const nombre = textoLimpio(datos.nombre, 60);
      const precio = Math.round(Number(datos.precio));
      exigir(nombre, 'Poné el nombre del premio.');
      exigir(precio > 0 && precio <= 100000, 'El precio tiene que ser un número mayor que 0.');
      return this._confirmar('premios', () => {
        const p = { id: util.nuevoId(), nombre, precio, activo: true };
        this.estado.premios.push(p);
        return p;
      });
    }

    editarPremio(id, datos) {
      const p = this.estado.premios.find((x) => x.id === id);
      exigir(p, 'Premio no encontrado.');
      const precio = Math.round(Number(datos.precio));
      exigir(textoLimpio(datos.nombre), 'Poné el nombre del premio.');
      exigir(precio > 0, 'El precio tiene que ser mayor que 0.');
      return this._confirmar('premios', () => { p.nombre = textoLimpio(datos.nombre, 60); p.precio = precio; });
    }

    eliminarPremio(id) {
      return this._confirmar('premios', () => {
        this.estado.premios = this.estado.premios.filter((x) => x.id !== id);
      });
    }

    canjear(perfilId, premioId) {
      const p = this.estado.premios.find((x) => x.id === premioId);
      exigir(p, 'Ese premio ya no está disponible.');
      exigir(this.saldo(perfilId) >= p.precio, 'Todavía no te alcanzan las monedas.');
      return this._confirmar('canjes', () => {
        const c = { id: util.nuevoId(), perfilId, premioId, nombre: p.nombre, precio: p.precio, fecha: Fecha.hoy(), entregado: false };
        this.estado.canjes.push(c);
        this._movimiento(perfilId, -p.precio, 'Canjeaste: ' + p.nombre, c.id, 'canje');
        return c;
      });
    }

    canjesDe(perfilId) { return this.estado.canjes.filter((c) => c.perfilId === perfilId); }

    marcarEntregado(canjeId) {
      const c = this.estado.canjes.find((x) => x.id === canjeId);
      exigir(c, 'Canje no encontrado.');
      return this._confirmar('canjes', () => { c.entregado = true; });
    }

    /** El padre cancela un canje y devuelve las monedas. */
    cancelarCanje(canjeId) {
      const c = this.estado.canjes.find((x) => x.id === canjeId);
      exigir(c && !c.entregado, 'Ese canje ya fue entregado.');
      return this._confirmar('canjes', () => {
        this._movimiento(c.perfilId, c.precio, 'Canje cancelado: ' + c.nombre, c.id, 'reintegro');
        this.estado.canjes = this.estado.canjes.filter((x) => x.id !== canjeId);
      });
    }

    // ---------- Cosméticos de la mascota ----------
    comprarCosmetico(perfilId, tipo, id) {
      const perfil = this.perfil(perfilId);
      const item = (reglas.COSMETICOS[tipo] || []).find((x) => x.id === id);
      exigir(perfil && item, 'Ítem no encontrado.');
      const lista = perfil.mascota[tipo];
      exigir(!lista.includes(id), 'Ya lo tenés.');
      exigir(this.saldo(perfilId) >= item.precio, 'Todavía no te alcanzan las monedas.');
      return this._confirmar('mascota', () => {
        lista.push(id);
        this._movimiento(perfilId, -item.precio, 'Compraste para tu mascota: ' + item.nombre, id, 'compra');
        this._equipar(perfil, tipo, id);
      });
    }

    equipar(perfilId, tipo, id) {
      const perfil = this.perfil(perfilId);
      exigir(perfil && perfil.mascota[tipo].includes(id), 'Todavía no lo compraste.');
      return this._confirmar('mascota', () => this._equipar(perfil, tipo, id));
    }

    _equipar(perfil, tipo, id) {

    registrarRevision(perfilId) {

    resumen(perfilId) {
      const hoy = Fecha.hoy();
      const manana = Fecha.sumarDias(hoy, 1);
      const hace7 = Fecha.sumarDias(hoy, -7);
      const tareas = this.tareasDe(perfilId);

        vencidas: pend.filter((t) => t.vence < hoy).length,
        urgentes: pend.filter((t) => t.vence === hoy || t.vence === manana).length,
        porAprobar: tareas.filter((t) => t.estado === 'enviada').length,
        sesionesSemana: tareas.filter((t) => t.tipo === 'sesion' && t.enviadaEl && t.enviadaEl >= hace7).length,
        rachaRevision: this.rachaRevision(perfilId),
        pomodorosSemana: this.estudio(perfilId, 7).pomodoros,
        vida: this.perfil(perfilId).vida.valor,

      };
    }

    mascota(perfilId) {
      const p = this.perfil(perfilId);
      const r = this.resumen(perfilId);
      const nivel = this.nivel(perfilId);
      const base = reglas.estadoMascota(r);
      return Object.assign(base, {
        nombre: p.mascota.nombre,
        nivel,
        xp: Math.max(0, this.xp(perfilId)),
        etapa: reglas.etapa(nivel, r.tieneTareas),
        color: reglas.color(p.mascota.color),
        fondo: reglas.fondo(p.mascota.fondo),
        vida: r.vida,
        comioHoy: r.comioHoy,
        vacaciones: r.vacaciones,
        resumen: r
      });
    }

    /**
     * Porcentaje de tareas entregadas a tiempo entre las que vencían en los últimos `dias` días.
     * Devuelve null si no hay tareas en ese período.
     */
    aTiempo(perfilId, dias, materiaId) {

/* js/pomodoro.js */
/*
 * pomodoro.js — Temporizador Pomodoro (bloques de foco y descanso).
 *
 * La cuenta regresiva se calcula siempre contra una hora de fin (finEn), no sumando
 * segundos: así el tiempo es exacto aunque el celular bloquee la pantalla o el
 * navegador frene la pestaña. El estado se guarda aparte para sobrevivir a una recarga.
 */
(function (AQ) {
  'use strict';

  const OPCIONES_FOCO = [15, 20, 25, 30];
  const OPCIONES_DESCANSO = [5, 10, 20];
  const MIN = 60000;

  class Temporizador {
    /**
     * @param {object} almacen objeto con getItem/setItem/removeItem (o null para no guardar)
     * @param {function} reloj función que devuelve la hora actual en ms (inyectable para pruebas)
     */
    constructor(almacen, reloj) {
      this.almacen = almacen || null;
      this.reloj = reloj || (() => Date.now());
      this.clave = 'agendaquest.pomodoro';
      this.estado = null;
      this._cargar();
    }

    get activo() { return !!this.estado; }

    /** Empieza un bloque de foco. */
    iniciar(perfilId, foco, descanso, tareaId) {
      if (!OPCIONES_FOCO.includes(Number(foco))) throw new AQ.ErrorValidacion('Elegí cuánto dura el pomodoro.');
      if (!OPCIONES_DESCANSO.includes(Number(descanso))) throw new AQ.ErrorValidacion('Elegí cuánto dura el descanso.');
      this.estado = {
        perfilId,
        foco: Number(foco),
        descanso: Number(descanso),
        tareaId: tareaId || null,
        fase: 'foco',
        finEn: this.reloj() + Number(foco) * MIN,
        restanteMs: null,
        completados: 0
      };
      this._guardar();
    }

    /** Empieza otro bloque de foco con la misma configuración. */
    otro() {
      if (!this.estado) return;
      this.estado.fase = 'foco';
      this.estado.finEn = this.reloj() + this.estado.foco * MIN;
      this.estado.restanteMs = null;
      this._guardar();
    }

    pausar() {
      const e = this.estado;
      if (!e || e.restanteMs != null || e.fase === 'listo') return;
      e.restanteMs = Math.max(0, e.finEn - this.reloj());
      e.finEn = null;
      this._guardar();
    }

    reanudar() {
      const e = this.estado;
      if (!e || e.restanteMs == null) return;
      e.finEn = this.reloj() + e.restanteMs;
      e.restanteMs = null;
      this._guardar();
    }

    get pausado() { return !!this.estado && this.estado.restanteMs != null; }

    /** Termina el descanso antes de tiempo y queda listo para otro pomodoro. */
    saltarDescanso() {
      if (!this.estado || this.estado.fase !== 'descanso') return;
      this.estado.fase = 'listo';
      this.estado.finEn = null;
      this.estado.restanteMs = null;
      this._guardar();

    terminar() {

      this._guardar();

    /** Milisegundos que faltan en la fase actual (0 si está esperando). */
    restante() {
      const e = this.estado;
      if (!e || e.fase === 'listo') return 0;
      if (e.restanteMs != null) return e.restanteMs;
      return Math.max(0, e.finEn - this.reloj());

    /** Duración total de la fase actual en ms. */
    total() {
      const e = this.estado;
      if (!e) return 0;
      return (e.fase === 'descanso' ? e.descanso : e.foco) * MIN;
    }

    /**
     * Avanza el reloj. Devuelve un evento si terminó una fase:
     *   { tipo: 'foco-completo', minutos, tareaId } o { tipo: 'descanso-completo' } o null.
     * Al terminar el foco empieza el descanso solo; al terminar el descanso espera
     * a que el estudiante toque "Otro pomodoro".
     */
    tick() {
      const e = this.estado;
      if (!e || e.restanteMs != null || e.fase === 'listo') return null;
      if (this.reloj() < e.finEn) return null;
      if (e.fase === 'foco') {

        e.fase = 'descanso';

      e.fase = 'listo';
      e.finEn = null;

    }

      if (!this.almacen) return;
      try {
        const texto = this.almacen.getItem(this.clave);
        this.estado = texto ? JSON.parse(texto) : null;
      } catch (e) { this.estado = null; }
    }

    _guardar() {
      if (!this.almacen) return;
      try {
        if (this.estado) this.almacen.setItem(this.clave, JSON.stringify(this.estado));

    }

  function formatear(ms) {
    const s = Math.ceil(ms / 1000);

  AQ.Sonido = Sonido;
  AQ.pomodoro = { OPCIONES_FOCO, OPCIONES_DESCANSO, formatear };
